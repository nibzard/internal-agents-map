claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The report documents confidence-threshold automation for fraud recommendations and describes
      L1 process work as fully automated in most cases, with the remainder reviewed by an analyst.
    valid_at: '2025-09-25'
  operating_models.1:
    confidence: low
    confidence_reason: The report documents human checks inside the KYC flow and humans reviewing LLM work, but
      a later passage shifts humans toward reviewing trends, so the per-run boundary is mixed in the evidence.
    valid_at: '2025-09-25'
  operating_models.2:
    confidence: medium
    confidence_reason: The report documents the servicing team picking among agent-drafted response options before
      anything is sent; initial outreach itself is automated.
    valid_at: '2025-09-25'
  headline_metric:
    valid_at: '2025'
    metric_scope: Dispute-submission preparation using the internal agent platform; not end-to-end chargeback resolution
    category: effectiveness
    basis: reported-measurement
    subject: Dispute-submission preparation time on the internal agent platform
  key_metrics.customer-support-cases-resolved-chatbot-first:
    valid_at: '2025'
    metric_scope: Customer-support cases resolved by the chatbot at first touch (Brex customer-facing product AI,
      adjacent to this internal platform)
    denominator: Customer-support cases; exact sample size not provided
    category: adoption-output
    basis: reported-measurement
    subject: Customer-support cases resolved by the chatbot at first touch (customer-facing product AI, adjacent
      to this platform)
  key_metrics.dispute-processing-hours-seconds:
    valid_at: '2025'
    metric_scope: Dispute-submission preparation using the internal agent platform; not end-to-end chargeback resolution
  key_metrics.qa-covers-support-interaction-one-person:
    valid_at: '2025'
    metric_scope: Quality assurance of customer-support interactions
    denominator: Every support interaction
    measurement_method: Agent applies the quality rubric to every response; one person oversees instead of five
      QA specialists
    category: effectiveness
    basis: reported-measurement
    subject: Support-interaction QA coverage and the staffing change from five specialists to one
  key_metrics.kyc-adverse-media-accuracy:
    valid_at: '2025'
    metric_scope: KYC adverse-media classification; human versus agent accuracy
    category: effectiveness
    basis: reported-measurement
    subject: KYC adverse-media classification accuracy, agent versus human
  lessons_learned.cto-recommends-automating-useful-portion-workflow:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The interview contrasts a 40% target with 100% and describes fraud cases still routed to
      analysts. These are the CTO's priorities, not measured optimal targets.
  lessons_learned.assigns-systems-engineering-team-maintain-internal:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The interview identifies the platform team and explains how new external MCP tools become
      available internally.
  lessons_learned.automates-high-confidence-fraud-cases-sends:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The fraud example names the automation boundary. It does not establish that all complete
      automation fails on accuracy.
  lessons_learned.operations-staff-engineers-translated-kyc-procedures:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The interview describes a joint, line-by-line review of operating procedures and subsequent
      human review of LLM work.
  lessons_learned.groups-legal-approvals-data-retention-training:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The approval tracks and defined controls are described in the interview; vendor identity
      alone is not the stated basis for those tracks.
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - brex-agent-platform-source-1
  - brex-onboarding-source
  workflow_scope: 'Two documented agent runs on the platform: dispute-submission preparation, and collections response
    drafting for the servicing team'
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.prepare-the-dispute-submission
      - primitives.draft-the-collections-response
      note: The prompt studio and the MCP bridge are build-time mechanisms. Platform-wide capability and the L1/L2/L3
        restructure stay out of the run description.
    human_involvement:
      state: not-applicable
      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.apply-the-quality-rubric
      note: The quality-rubric agent checks every support interaction; the KYC human checks are cited with human
        involvement.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: 'Deployed-agent models are not documented; the platform provides multi-model testing and
        evaluation at build time.'
    sandbox:
      note: Retool hosts the runtime; the capture describes no further isolation boundary.
    tool_access:
      note: The MCP bridge and immediate internal availability are supported at line 40; the Slack /c1 clause describes
        provisioning configuration, not agent invocation (flagged).
    context_mgmt:
      state: unreported
      note: No mechanism for maintaining agent context over time is documented; the QA feedback loop improves performance
        rather than managing context.
    credentials:
      note: SSO via Retool proxies, Okta provisioning, and the retention and segregation controls are supported
        at lines 60–62; the ConductorOne vendor name is not in the capture (flagged).
  aliases:
    key_metrics.dispute-processing-hours-seconds:
      duplicate_of: headline_metric
      reason: Identical subject, values, period, scope, and locator as the headline; the shorthand adds nothing.
