id: plaid-internal-mcp-server
company: Plaid
agent_name: Internal MCP server
approach_type: supporting-pattern
deployment_stage: scaled
first_public_evidence:
  date: '2025'
  source_id: plaid-internal-mcp-server-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
autonomy: unknown
operating_models:
- scope: engineer request → internal tool access
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  evidence_strength: detailed-primary
summary: Plaid's internal Model Context Protocol server is supporting infrastructure rather than an agent. The central
  server connects engineers' AI tools to internal systems such as Jira, application logs, and data schemas that
  third-party MCP servers cannot reach.
headline_metric: Dozens of agents rely on the internal MCP server; Claude Code and Cursor are used by over 80% of
  engineers
architecture:
  harness: Central internal MCP server that fronts vendor AI clients
  tool_access: More than 20 tools and several internal services (Jira, logs, schemas)
  credentials: Behind Plaid's identity-aware proxy and centralized authorization
primitives:
- id: connect-an-ai-client
  name: Connect an AI client
  desc: An engineer's AI tool such as Claude Code or Cursor reaches internal data through the one central internal
    MCP server instead of a locally managed arrangement of MCP servers
  role: workflow
- id: authenticate-the-engineer
  name: Authenticate the engineer
  desc: CLI-based authentication uses the Device Authorization Grant flow with DPoP and short-lived bearer tokens
    through a locally running proxy
  role: workflow
- id: authorize-the-request
  name: Authorize the request
  desc: The identity-aware proxy validates a Plaid managed device and identity-provider login; a signed identity
    token is parsed and the centralized authorization server checks the employee's access to the target service
  role: workflow
- id: enforce-data-policy-at-call-time
  name: Enforce data policy at call time
  desc: Tool-level controls enforce the LLM data access policy when a tool is called, and the centralized design
    adds caller identity inspection and audit logging
  role: validation
- id: return-internal-context
  name: Return internal context
  desc: The tool returns data from internal systems such as Jira, application logs, and data schemas to the AI client
  role: workflow
key_metrics:
- id: claude-code-cursor-used-plaid-engineers
  text: Claude Code and Cursor are used by over 80% of Plaid engineers; the source does not report internal MCP server
    adoption share
- id: thousands-tool-calls-dozens-agents-built
  text: Thousands of tool calls and dozens of agents built on it
