id: strongdm-software-factory
company: StrongDM
agent_name: Software Factory
aliases:
- StrongDM AI Software Factory
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026-02-06'
  source_id: strongdm-factory-overview
last_reviewed_at: '2026-09-17'
status: mixed
domains:
- coding
autonomy: autonomous
operating_models:
- scope: natural-language seed → agents implement and validate against scenario harness → converged software
  attention_boundary: unknown
rubric:
  invocation:
  - background
  evidence_strength: detailed-primary
summary: An internal agent system in which natural-language seeds and end-to-end scenario harnesses drive agents
  that write, validate, and iterate on code under standing rules that humans neither write nor review code.
architecture:
  harness: End-to-end scenario harness with user-story-style scenarios kept outside the codebase as a holdout set
    and checked by an LLM; satisfaction measured as the fraction of observed scenario trajectories that likely satisfy
    the user; Digital Twin Universe clones of Okta, Jira, Slack, Google Docs, Google Drive, and Google Sheets absorb
    scenario load
  model: Multi-provider routing by task as of 2026-06 (gpt-5.5 for everyday and DevOps tasks, QA orchestration,
    and security review; consensus of opus-4.8 and gpt-5.5 for sprint planning; opus-4.8 for frontend aesthetics
    and writing; gemini-3-flash-preview for image comprehension and agentic dialogues; gpt-image-2 and gpt-realtime-2
    for UX ideation and voice)
  tool_access: Filesystem that agents read and write to self-manage context; Digital Twin Universe as a stand-in
    for third-party services
  knowledge: CXDB, a self-hosted context store for AI agents with turn DAG, blob deduplication, dynamic types, and
    visual debugging
  credentials: StrongDM ID, an identity system for humans, workloads, and AI agents with federated authentication
    and path-scoped sharing
  context_mgmt: Pyramid Summaries with reversible summarization at multiple zoom levels; on-disk state as the memory
    substrate
primitives:
- id: scenarios
  name: Scenarios
  desc: End-to-end user-story validations, often stored outside the codebase like a training holdout set, flexibly
    checked by an LLM to resist reward hacking and lazy test rewriting
  role: validation
- id: satisfaction
  name: Satisfaction
  desc: Probabilistic success measure replacing boolean test-green; the fraction of all observed scenario trajectories
    that likely satisfy the user
  role: validation
- id: digital-twin-universe
  name: Digital Twin Universe
  desc: Behavioral clones of third-party services that replicate APIs, edge cases, and observable behaviors, so
    thousands of scenarios can run per hour without rate limits, abuse detection, or live-API cost
  role: mechanism
- id: shift-work
  name: Shift Work
  desc: Splitting work into interactive and fully specified classes; when specs, tests, and the existing app fully
    express intent, an agent runs end-to-end without back-and-forth
  role: mechanism
- id: attractor
  name: Attractor
  desc: Non-interactive coding agent structured as a graph of work phases with natural-language edges evaluated
    by the LLM; execution traverses the graph until convergence or termination, and the spec is open source
  role: mechanism
- id: seed-the-work
  name: Seed the work
  desc: A natural-language seed — a few sentences, a screenshot, or an existing codebase — starts the run
  role: workflow
- id: implement-and-validate-in-the-loop
  name: Implement and validate in the loop
  desc: Agents write code and run the end-to-end scenario harness; a sample of the output feeds back into the inputs
    so the system self-corrects
  role: workflow
- id: converge-on-the-holdout-scenarios
  name: Converge on the holdout scenarios
  desc: The loop runs until the holdout scenarios pass and stay passing, and the code ships without human review
  role: workflow
key_metrics: []
lessons_learned:
- id: advocates-evaluating-generated-code-through-observable
  text: StrongDM advocates evaluating generated code through observable behavior while treating its internal structure
    as opaque.
- id: specification-validation-harness-feedback-loop-stops
  text: StrongDM describes a specification, validation harness, and feedback loop that stops when holdout scenarios pass
    and remain passing.
- id: proposes-spending-least-tokens-per-human
  text: StrongDM proposes spending at least $1,000 in tokens per human engineer per day as an operating benchmark for
    its software factory.
