claim_metadata:
  operating_models.0:
    confidence: unverified
    confidence_reason: The site documents zero human code-writing and review with automatic scenario validation,
      but no passage states that a person is summoned when scenarios fail to converge; what happens on non-convergence
      is undocumented.
    valid_at: 2026-09
  architecture.model:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: First-party configuration log current as of 2026-06-04.
    valid_at: 2026-06
  lessons_learned.advocates-evaluating-generated-code-through-observable:
    kind: opinion
    provenance: reported
    confidence: high
    confidence_reason: The techniques page explicitly compares code with an opaque model snapshot; this is a stated
      evaluation philosophy, not proof that source review has no value.
  lessons_learned.specification-validation-harness-feedback-loop-stops:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The principles page states the loop and termination condition. It does not document who handles
      a run that fails to converge.
  lessons_learned.proposes-spending-least-tokens-per-human:
    kind: opinion
    provenance: reported
    confidence: high
    confidence_reason: The overview presents the amount as a principle, without cost-benefit measurements that would
      justify it as a target for other teams.
    valid_at: 2026-02
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - strongdm-factory-overview
  - strongdm-factory-principles
  - strongdm-factory-techniques
  - strongdm-factory-products
  - strongdm-attractor-spec
  - strongdm-factory-weather-report
  - strongdm-attractor-repo
  workflow_scope: Natural-language seed through the validation-feedback loop to converged software
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.seed-the-work
      - primitives.implement-and-validate-in-the-loop
      - primitives.converge-on-the-holdout-scenarios
    human_involvement:
      state: reported
      claim_paths:
      - summary
      note: The standing rules exclude humans from writing or reviewing code; what happens when a run fails to converge
        is not documented, and the unknown attention-boundary judgment stays in research details.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.scenarios
      - primitives.satisfaction
      note: End-to-end holdout scenarios scored by satisfaction; the Digital Twin Universe carries the validation
        load and stays under implementation as a reusable mechanism.
    observations:
      state: unreported
      note: The captures state principles, techniques, and model configuration; they report no measured outcomes
        of the factory's software. The token-spend figure is a stated operating principle kept under lessons.
    lessons:
      state: reported
  implementation_fields:
    credentials:
      note: StrongDM ID covers identity for humans, workloads, and agents; secret handling inside runs is not further
        documented.
    interfaces:
      state: unreported
      note: No human-facing surface is named; the factory is non-interactive and work starts from natural-language
        seeds.
