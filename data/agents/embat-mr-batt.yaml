summary: Embat's internal agent platform began as a support tool for the Product Experience
  team and now serves the whole company through Slack. A router sends each message to one
  of more than ten specialist agents, each mapped to a module, task, or tool set.
headline_metric: Grew from two agents to more than ten specialist agents
architecture:
  harness: Built on the Claude Managed Agents platform, with a lightweight router in front
    of the specialists; one tool spins up a Google ADK agent instead
  tool_access: Embat databases, logs, bank providers, the company's own code repositories,
    and the Semantic Layer
  knowledge: Each agent is defined by a system prompt, its allowed tools, and the repositories
    it may read; routing, Slack plumbing, memory, and tool execution are shared
  interfaces:
  - slack
primitives:
- {id: route-to-specialist, name: Route to a specialist, desc: 'A lightweight step reads the conversation and picks the agent that best fits before any specialist runs', role: workflow}
- {id: ask-user-when-router-unsure, name: Ask the user when routing is unsure, desc: 'When the router is not confident, it asks the person to choose; messages that are not support requests get a separate place', role: workflow}
- {id: per-domain-specialist, name: One specialist per domain, desc: 'Each agent maps to a module, task, or tool set, and the team that owns the domain owns the agent behavior', role: mechanism}
- {id: configure-agent-declaratively, name: Declare an agent in one place, desc: 'An agent is a system prompt, a tool allowlist, and a list of readable repositories; people who cannot code can configure one', role: mechanism}
lessons_learned:
- id: generalist-prompt-interference
  text: Embat's single generalist agent needed one large system prompt that no team fully
    owned, and prompt changes in one domain degraded performance in another; splitting into
    per-domain specialists removed the interference.
- id: router-asks-rather-than-guesses
  text: With more than ten agents, Embat kept a human in the loop at routing, where an unsure
    router asks the person to choose instead of picking wrong.
- id: borrow-harness-spend-on-tools
  text: Embat chose to borrow the Claude Managed Agents platform rather than build an agent
    loop, and spent its effort on tools, data access, and answer speed instead.
