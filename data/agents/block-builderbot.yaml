  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.slack-thread-start
      - primitives.ticket-driven-flow
    human_involvement:
      state: reported
      claim_paths:
      - lessons_learned.slack-mention-starts-builderbot-existing-thread
      - lessons_learned.several-people-steer-builderbot-researches-plans
      note: Colleagues steer runs in the Slack thread; the engineering post adds that humans grant the final stamp
        of approval on pull requests (lines 46, 50).
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.ci-watch-and-iteration
      note: The launch post documents CI watch and feedback iteration; the pre-push just checks in the engineering
        post cover local agents generally and are not tied to Builderbot's runs.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: 'The captures name the goose orchestration framework but no underlying model; the public
        repository README names apps and crates only.'
    tool_access:
      note: The launch post also limits operation to source code and system configuration, with no customer data
        or PII.
    credentials:
      state: unreported
      note: Credential handling is not documented; the source-code-only boundary is a data restriction, not a credential
        mechanism.
    interfaces:
      note: Slack, Linear, and Jira are named in the launch post; the pull-request host is not named in the captures.
  aliases:
