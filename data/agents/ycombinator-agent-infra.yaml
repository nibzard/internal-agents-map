operating_models:
- scope: internal request → agent-assisted organizational work
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  - scheduled
  evidence_strength: detailed-primary
summary: Y Combinator built its own agent harness and infrastructure, led by partner Pete Koomen. It is an agent
  loop over a shared tool registry, now over 350 tools, including one that runs read-only SQL against YC's single
  Postgres database. Agent conversations are broadcast to a Slack channel.
architecture:
  harness: Own harnesses built from the ground up for internal AI use
  tool_access: Shared registry of more than 350 YC-specific tools, including read-only SQL access
  interfaces:
  - slack
  knowledge: A shared database and common context layer expose YC's internal organizational context
  context_mgmt: An agent loop uses a shared tool registry, skill registry, and model router
primitives:
- id: finance-question
  name: Finance question
  desc: A finance team member asks a real operational question in natural language instead of writing SQL or requesting
    purpose-built software
  role: workflow
- id: read-only-data-access
  name: Read-only data access
  desc: The general agent loop selects tools from the shared registry and can run read-only SQL against YC's database
    and read model files
  role: workflow
- id: employee-visible-conversation
  name: Employee-visible conversation
  desc: Agent conversations are broadcast to an internal Slack channel where employees can inspect and learn from
    them
  role: workflow
- id: nightly-skill-review
  name: Nightly skill review
  desc: A general agent reads employee-agent conversations nightly to identify failures and missing context that
    could improve shared skills
  role: validation
lessons_learned:
- id: shared-database-and-tool-registry
  text: YC makes a shared database and tool registry available to its internal agents, with teams adding tools for their
    own work.
- id: began-own-agent-harness
  text: YC began its own agent harness while working with its finance team on top of existing internal software.
