claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The engineering blog describes engineers acting on Sidekick review comments, which locates
      human attention at work-product review.
    valid_at: 2026-03
  headline_metric:
    confidence: medium
    confidence_reason: HubSpot reported the figures in its own engineering blog without independent verification.
    valid_at: 2026-03
    reported_by: HubSpot
    metric_scope: Time for engineers to receive code feedback from Sidekick; not overall PR completion time
    category: cost-latency
    basis: reported-measurement
    subject: 'Sidekick review coverage of
      HubSpot pull requests and the time engineers wait for feedback'
  key_metrics.reviews-every-pull-request:
    confidence: medium
    confidence_reason: HubSpot reported the figures in its own engineering blog.
    metric_scope: Pull-request coverage after the six-month rollout
    denominator: HubSpot pull requests
  key_metrics.engineer-feedback-time-cut:
    confidence: medium
    confidence_reason: HubSpot reported the figures in its own engineering blog.
    metric_scope: Time for engineers to receive code feedback from Sidekick; not overall PR completion time
  key_metrics.thumbs-reaction-rate-review-feedback:
    confidence: medium
    confidence_reason: HubSpot reported the figures in its own engineering blog.
    metric_scope: Developer emoji reactions on review comments during the preceding couple of months
    denominator: Thumbs-up and thumbs-down reactions; not all developers or all reviews
    measurement_method: Emoji reactions and replies on review comments
    category: effectiveness
    basis: reported-measurement
    subject: 'Developer thumbs-up share of
      reactions on Sidekick review comments over the preceding couple of months'
  lessons_learned.unhelpful-rather-incorrect-feedback-most-common:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: HubSpot attributed the improvement chiefly to the judge gate in its own engineering blog;
      no independent evaluation exists.
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [hubspot-sidekick-source-1, hubspot-sidekick-source-2]
  workflow_scope: Pull request opened → Sidekick draft review → judge-gated comments posted to GitHub
  questions:
    purpose: {state: reported}
    workflow: {state: reported, claim_paths: [primitives.trigger-review, primitives.draft-the-review, primitives.post-passing-comments]}
    human_involvement: {state: unreported, note: 'The review flow is automated end to end. The
      captures document post-hoc emoji and thread feedback on comments (source 1, lines 103–108) and continued human
      review for system design and architecture (line 12), but no required human checkpoint inside the review flow.'}
    implementation: {state: reported}
    validation: {state: reported, claim_paths: [primitives.judge-each-draft-comment]}
    observations: {state: reported}
    lessons: {state: reported}
  implementation_fields:
    model: {state: unreported, note: 'No capture states which model the review runs on. Multi-model
      support (Claude, GPT, Gemini) is a capability of the Aviator framework (source 1, line 45), not a statement
      about this reviewer.'}
    sandbox: {state: unreported, note: 'Execution isolation of the Aviator runtime is not
      documented. The Kubernetes sandboxing described in source 2 (lines 30–37) covers the earlier Crucible
      implementation.'}
    context_mgmt: {state: unreported, note: 'The captures describe no mechanism that maintains or
      organizes context for the reviewer over time.'}
  aliases:
    key_metrics.reviews-every-pull-request: {duplicate_of: headline_metric, reason: 'Restates the every-pull-request coverage component of
      the compound headline; same passage, scope, and period.'}
    key_metrics.engineer-feedback-time-cut: {duplicate_of: headline_metric, reason: 'Restates the 90 percent feedback-time component of the
      compound headline; same passage and metric scope.'}
