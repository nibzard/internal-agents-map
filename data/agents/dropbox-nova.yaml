claim_metadata:
  operating_models.0:
    confidence: unverified
    confidence_reason: Deflaker automates bounded repair and CI validation, while publication stays outside the
      agent. The source does not specify a required human approval or exception-handling boundary.
    valid_at: '2026-05-22'
  operating_models.1:
    confidence: medium
    confidence_reason: The source describes standard interactive chat sessions in which engineers launch and steer
      agents; the exact review boundary of those sessions is not further specified.
    valid_at: '2026-05-22'
  lessons_learned.attributes-much-nova-usefulness-surrounding-execution:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective explicitly makes this assessment and names context files, tests, caching,
      isolation, and retry loops; it provides no controlled component comparison.
  lessons_learned.return-failed-validation-results-agent-continue:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The session example describes optional validation commands and continuation on failure, making
      the feedback mechanism explicit.
  lessons_learned.moved-ci-triggering-outside-agent-seeing:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective names these failure modes and explains that surrounding workflows trigger
      CI and call the agent back for repair.
  lessons_learned.reuses-dropbox-bazel-premise-validation-paths:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Dropbox gives its repository shape and existing build infrastructure as reasons for integration,
      rather than a separate agent-only workflow.
  headline_metric:
    metric_scope: Migration-owner orchestration of dozens of agents from a shared runbook; qualitative capacity
      description
    category: runtime-capacity
    basis: qualitative
    subject: Parallel agents a migration owner launches and manages from one runbook
  key_metrics.dozens-agents-launchable-one-runbook:
    metric_scope: Migration-owner orchestration of dozens of agents from a shared runbook; qualitative capacity
      description
  key_metrics.flaky-test-remediation-deflaker-validation-runs:
    metric_scope: CI validation runs per proposed Deflaker flaky-test fix
    measurement_method: Run the test 100 or more times depending on its failure rate; retry capped at five fix attempts
    category: runtime-capacity
    basis: reported-measurement
    subject: CI validation runs per proposed Deflaker flaky-test fix
  key_metrics.predecessor-goose-based-migrator-used-thousands:
    metric_scope: Predecessor Goose-based migrator, before workflows moved onto Nova
    category: adoption-output
    basis: reported-measurement
    subject: Migration entries processed by the predecessor Goose-based migrator before workflows moved onto Nova
