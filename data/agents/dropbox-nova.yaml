# yaml-language-server: $schema=../agent.schema.json
id: dropbox-nova
company: Dropbox
agent_name: Nova
approach_type: platform
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: dropbox-nova-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
- ci-triage
- on-call
- maintenance
autonomy: autonomous
operating_models:
- scope: event-triggered validation-gated remediation (Deflaker, crash-alert candidate fixes) → landed fix or candidates
    routed to service teams
  attention_boundary: unknown
- scope: interactive developer session from web, CLI, or Slack → agent-assisted change
  attention_boundary: continuous-steering
rubric:
  invocation:
  - event-driven
  - interactive
  evidence_strength: detailed-primary
summary: Nova is Dropbox's internal service for running coding agents in its cloud. Engineers launch parallel sessions
  from a web UI, CLI, or API, and internal systems call agents inside automated workflows like CI triage and migrations.
  Callers attach validation commands that Nova runs after each attempt.
headline_metric: Dozens of agents can run in parallel from one runbook
architecture:
  sandbox: Isolated env with a codebase snapshot at a specific commit; full Dropbox monorepo via Bazel; hermetic
    remote execution + caching
  harness: Validation loop (propose → validate → feed back) with continue_on_validation_failure and max_iterations
    (~5); branch management kept outside the agent
  model: Multiple coding agents behind one interface; prompt-evaluation tooling; helpers that make it easier to
    add AI-powered steps without rebuilding surrounding infrastructure; sources name no specific model or provider
  interfaces:
  - web
  - cli
  - api
  - slack
  tool_access: Skills/plugins to gather evidence, read logs, inspect failures; MCP integrations; Bazel-aware selectivity
    tools
  knowledge: Localized AGENTS.md per service; Dash (Dropbox context engineering); passing + failing test logs
  context_mgmt: Session history (notes/logs) carried across retry attempts
primitives:
- id: validation-loop
  name: Validation loop
  desc: Bounded iteration with feedback on failure; deterministic systems control test execution
  role: mechanism
- id: dash
  name: Dash
  desc: Nova is expanding its context sources, including Dash and MCP-based integrations
  role: mechanism
- id: ingest-flaky-test-evidence
  name: Ingest flaky-test evidence
  desc: Athena detects a flaky test; the Deflaker workflow sends its passing and failing logs to Nova as context
    and asks the agent to identify a likely root cause
  role: workflow
- id: propose-a-root-cause-fix
  name: Propose a root-cause fix
  desc: The Nova agent proposes a fix for the flaky test
  role: workflow
- id: validate-the-fix-in-ci
  name: Validate the fix in CI
  desc: CI runs the test 100 or more times depending on its failure rate to check the proposed change
  role: validation
- id: retry-with-carried-forward-notes
  name: Retry with carried-forward notes
  desc: A flake starts another attempt with new logs and notes from the previous one, until a working fix lands
    or attempts reach the cap of five
  role: workflow
key_metrics:
- id: flaky-test-remediation-deflaker-validation-runs
  text: 'Flaky-test remediation (Deflaker): 100+ validation runs'
- id: predecessor-goose-based-migrator-used-thousands
  text: Predecessor Goose-based migrator used across thousands of migration entries before workflows moved onto Nova
- id: dozens-agents-launchable-one-runbook
  text: Dozens of agents launchable from one runbook
lessons_learned:
- id: attributes-much-nova-usefulness-surrounding-execution
  text: Dropbox attributes much of Nova's usefulness to its surrounding execution and validation infrastructure.
- id: return-failed-validation-results-agent-continue
  text: Nova can return failed validation results to the agent and continue the session to repair the proposed change.
- id: moved-ci-triggering-outside-agent-seeing
  text: Dropbox moved CI triggering outside the agent after seeing waits of hours and validation against the wrong tests.
- id: reuses-dropbox-bazel-premise-validation-paths
  text: Nova reuses Dropbox's Bazel and on-premise validation paths because those systems support its monorepo development
    workflow.
