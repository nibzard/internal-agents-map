claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The source documents delegated coding output while a human remains accountable for the assigned
      issue.
    valid_at: '2026-08-11'
  lessons_learned.customer-support-workflow-carries-intercom-conversations:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The workflow retains customer messages, metadata, and attachments before delegation; it
      documents how context moves between the systems.
  lessons_learned.recommends-starting-agent-suggestions-observing-results:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The article presents this as its rollout advice, without a defined reliability threshold
      or measured comparison of rollout strategies.
  lessons_learned.one-linear-engineer-reports-better-results:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The account attributes the practice to Matthijs Wolting; it does not report a benchmark
      across task sizes.
  lessons_learned.engineer-finds-agent-mistakes-useful-identifying:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The article attributes this reaction to Mingjie and describes continued human ownership
      of the issue.
  lessons_learned.completion-events-notify-originating-support-workflow:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Completed issues reopen related Intercom requests or notify the Slack thread. In both
      examples, the support team performs the customer follow-up.
