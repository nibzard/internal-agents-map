# yaml-language-server: $schema=../agent.schema.json
id: uber-coding-agent
company: Uber
agent_name: Internal coding agent (unnamed)
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026'
  source_id: uber-coding-agent-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
autonomy: drafts-reviewed
operating_models:
- scope: coding request → complete code change
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  evidence_strength: secondary-only
summary: Uber runs an internal coding agent that writes complete code changes with no human authoring, and engineers review
  and approve them. Its CTO reports that engineers now delegate tasks to the agent rather than accept its suggestions, and
  that its share of all code changes has grown from under 1%.
headline_metric: ~1,800 complete code changes per week (~8% of changes)
primitives:
- {id: delegate-the-task, name: Delegate the task, desc: Engineers delegate coding tasks to the agent rather than accepting its suggestions, role: workflow}
- {id: write-the-complete-change, name: Write the complete change, desc: The agent writes the entire code change with zero human authoring, role: workflow}
- {id: review-and-approve, name: Review and approve, desc: An engineer reviews and approves the agent-written change, role: workflow}
key_metrics:
- id: complete-code-changes-per-week
  text: ~1,800 complete code changes per week (~8% of changes at the time)
- id: engineers-use-ai-tools-monthly
  text: 95% of engineers use AI tools monthly
lessons_learned:
- id: cto-describes-engineer-role-shifting-writing
  text: Uber's CTO describes the engineer's role shifting from writing every line to architecting systems and
    reviewing AI-generated code.
- id: cto-attributes-strongest-adoption-engineers-quietly
  text: Uber's CTO attributes the strongest adoption to engineers quietly experimenting, not to a top-down push.
sources:
- id: uber-coding-agent-source-1
  title: Uber's CTO on AI coding agents (Business Insider)
  url: https://www.businessinsider.com/uber-cto-ai-coding-agentic-software-engineers-2026-3
  kind: news
  provenance_class: independent-secondary
  accessed_at: '2026-08-12'
  last_verified_at: '2026-08-31'
  capture:
    manifest_path: archive/sources/uber-coding-agent-source-1/metadata.json
evidence:
  operating_models.0:
  - locator: Preserved content.md, line 26 (zero human authoring; engineers review and approve)
  summary:
  - source_id: uber-coding-agent-source-1
  headline_metric:
  - locator: Preserved content.md, lines 24–26
  key_metrics.complete-code-changes-per-week:
  - locator: Preserved content.md, lines 24–26
  key_metrics.engineers-use-ai-tools-monthly:
  - locator: Preserved content.md, lines 18
  primitives.delegate-the-task:
  - {locator: 'Preserved content.md, line 24'}
  primitives.write-the-complete-change:
  - {locator: 'Preserved content.md, lines 24–26'}
  primitives.review-and-approve:
  - {locator: 'Preserved content.md, line 26'}
  lessons_learned.cto-describes-engineer-role-shifting-writing:
  - {locator: 'Preserved content.md, line 36'}
  lessons_learned.cto-attributes-strongest-adoption-engineers-quietly:
  - {locator: 'Preserved content.md, line 30'}
claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The CTO states there is zero human authoring and that engineers review and approve the
      agent-written code, which locates human attention at review of the work product.
    valid_at: '2026'
  summary:
    confidence: medium
    confidence_reason: Only limited public evidence supports this claim.
  headline_metric:
    confidence: medium
    confidence_reason: Only limited public evidence supports this claim.
    metric_scope: Code changes written entirely by the internal coding agent and human reviewed
    denominator: All Uber code changes for the reported 8% share
    category: adoption-output
    basis: reported-measurement
    subject: 'Weekly code changes written
      entirely by the internal coding agent, and their share of all Uber code changes'
  key_metrics.complete-code-changes-per-week:
    confidence: medium
    confidence_reason: Only limited public evidence supports this claim.
    metric_scope: Code changes written entirely by the internal coding agent and human reviewed
    denominator: All Uber code changes for the reported 8% share
  key_metrics.engineers-use-ai-tools-monthly:
    confidence: medium
    confidence_reason: Only limited public evidence supports this claim.
    metric_scope: Monthly use of AI tools among Uber engineers; not internal-agent-specific adoption
    denominator: Uber engineers
    category: adoption-output
    basis: reported-measurement
    subject: 'Monthly AI-tool use among Uber
      engineers generally, not specific to this agent'
  primitives.delegate-the-task:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: A single secondary article relays the CTO's statement about delegation versus suggestions.
  primitives.write-the-complete-change:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The CTO's zero-human-authoring statement is relayed verbatim by one secondary article.
  primitives.review-and-approve:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: One secondary article relays the CTO's review-and-approve description without naming the
      review venue or policy.
  lessons_learned.cto-describes-engineer-role-shifting-writing:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: An attributed view of one CTO on the engineer's role, relayed by a single secondary article.
  lessons_learned.cto-attributes-strongest-adoption-engineers-quietly:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: An attributed adoption observation of one CTO; no adoption method or measurement is described.
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [uber-coding-agent-source-1]
  workflow_scope: Delegated coding task to engineer-approved code change
  questions:
    purpose: {state: reported}
    workflow: {state: reported, claim_paths: [primitives.delegate-the-task, primitives.write-the-complete-change, primitives.review-and-approve], note: 'The three steps carry
      the full delegation-to-approval arc the article describes; no other stage is documented.'}
    human_involvement: {state: reported, claim_paths: [summary, operating_models.0], note: 'Engineers review and
      approve every agent-written change; the CTO describes zero human authoring.'}
    implementation: {state: unreported}
    validation: {state: reported, claim_paths: [primitives.review-and-approve], note: 'The documented check of the work is the human
      review gate cited with human involvement; no automated check is described.'}
    observations: {state: reported}
    lessons: {state: reported, note: 'Two attributed opinions
      of the CTO, relayed by a single secondary article.'}
  aliases:
    key_metrics.complete-code-changes-per-week: {duplicate_of: headline_metric, reason: 'Same weekly count and 8% share from the same passage;
      the at-the-time wording only makes explicit the point-in-time framing the headline growth statement already
      carries, so it adds no separate information.'}
