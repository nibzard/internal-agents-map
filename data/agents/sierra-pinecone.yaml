# yaml-language-server: $schema=../agent.schema.json
id: sierra-pinecone
company: Sierra
agent_name: Pinecone
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: sierra-pinecone-source-1
last_reviewed_at: '2026-09-16'
featured: true
status: internal
domains:
- coding
- code-review
- support
- research
- data
autonomy: drafts-reviewed
operating_models:
- scope: employee request → reviewed agent output
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  - interactive
  - scheduled
  evidence_strength: detailed-primary
summary: Pinecone is Sierra's shared agent interface for employee work. It routes requests to a model, harness,
  and environment, runs sessions on Agency, and connects to company systems through an MCP Gateway.
headline_metric: More than 75,000 sessions created by 600 people in the month preceding the report
architecture:
  sandbox: Agency layer reconciles recoverable Kubernetes runners; conversation/events/checkpoints stay durable
    separately
  harness: App server + Agency + runners; intent-based model/environment routing (Claude Code + Codex)
  model: Claude Code + Codex; a classifier routes by task intent to select repository, environment, harness, model,
    and reasoning budget
  interfaces:
  - slack
  - web
  - linear
  - mobile
  tool_access: MCP Gateway connected to 45 systems; a network proxy decides whether privileged requests proceed
    and injects credentials after approval
  knowledge: Durable sessions over disposable environments; Redis Streams
  credentials: Gateway enforces the invoking employee's access at tool-call time and isolates customer data; the
    harness never holds the real secret
  context_mgmt: Durable session state separated from ephemeral compute
primitives:
- id: mcp-gateway-systems
  name: MCP Gateway (45 systems)
  desc: One gateway spanning 45 systems, enforcing employee permissions at call time
  role: mechanism
- id: agency-sandbox-layer
  name: Agency sandbox layer
  desc: Recoverable K8s runners with a network proxy for credential injection
  role: mechanism
- id: intent-based-routing
  name: Intent-based routing
  desc: Routes model and environment by request intent, independent of the tool layer
  role: mechanism
- {id: start-a-session-from-a-prompt, name: Start a session from a prompt, desc: 'A prompt creates an isolated pod with a checked-out repository, warm
    build cache, sidecars, and a harness; the session streams its work back for watching, interrupting, or
    redirecting', role: workflow}
- {id: broker-its-own-pull-requests, name: Broker its own pull requests, desc: 'A session opens its own pull requests and watches its own checks', role: workflow}
- {id: babysit-the-pull-request, name: Babysit the pull request, desc: 'A monitor sub-agent answers machine-review comments, fixes failing tests,
    rebases on conflicts, and pings a person in Slack when a decision needs a human', role: validation}
key_metrics:
- id: sessions-created-people-month-preceding
  text: More than 75,000 sessions created by 600 people in the month preceding the report
- id: prs-opened-through-pinecone-month-preceding
  text: 70% of company PRs opened through Pinecone in the month preceding the report
- id: engineering-uses-pinecone-majority-company-works
  text: '96% of engineering uses Pinecone; the majority of the company works in it every day'
- id: usage-tripled-month-since-april-costs
  text: Usage has tripled every month since April while costs fell
lessons_learned:
- id: presents-one-entry-point-classifier-chooses
  text: Pinecone presents one entry point while a classifier chooses the repository, environment, harness, and model
    for the task.
- id: wraps-codex-claude-code-behind-common
  text: Sierra wraps Codex and Claude Code behind a common runner protocol and can change routing defaults centrally.
- id: gateway-audits-customer-data-access-blocks
  text: Sierra's gateway audits customer-data access and blocks sensitive access spanning multiple customers in a
    session; some CLI access uses separate read-only tokens.
- id: session-total-measures-use-only
  text: Sierra's session total measures use of Pinecone; it does not by itself measure time saved or the quality of
    completed work.
