claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The source documents delegated work through a company-wide agent without establishing outcome-only
      supervision.
    valid_at: '2026'
  lessons_learned.presents-one-entry-point-classifier-chooses:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The single-agent section describes routing behind the interface, so one employee-facing
      agent does not imply one model or execution environment.
  lessons_learned.wraps-codex-claude-code-behind-common:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective describes shared adapters and configurable defaults; it supports interchangeable
      harnesses without claiming every model fits every task.
  lessons_learned.gateway-audits-customer-data-access-blocks:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The gateway article describes provenance checks and scoped CLI tokens. These bound particular
      actions without making every permitted action safe.
  lessons_learned.session-total-measures-use-only:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The source reports session volume and centralized cost oversight, but provides no method
      for converting each session into time saved or a quality measure.
  headline_metric:
    metric_scope: Pinecone users and sessions in the month preceding the report; calendar month unspecified
    category: adoption-output
    basis: reported-measurement
    subject: 'Pinecone sessions created
      by Sierra employees in the month preceding the report'
  key_metrics.sessions-created-people-month-preceding:
    metric_scope: Pinecone users and sessions in the month preceding the report; calendar month unspecified
  key_metrics.prs-opened-through-pinecone-month-preceding:
    metric_scope: Company PRs opened through Pinecone in the month preceding the report
    denominator: Sierra PRs opened in that month; not merged PRs
    category: adoption-output
    basis: reported-measurement
    subject: 'Sierra pull requests opened
      through Pinecone in the month preceding the report'
  key_metrics.engineering-uses-pinecone-majority-company-works:
    confidence: medium
    confidence_reason: Sierra reported the adoption shares in its engineering blog without a method.
    valid_at: '2026'
    reported_by: Sierra
    metric_scope: Engineering use of Pinecone and company-wide daily use at report time
    category: adoption-output
    basis: reported-measurement
    subject: 'Engineering adoption of
      Pinecone and company-wide daily use'
  key_metrics.usage-tripled-month-since-april-costs:
    confidence: medium
    confidence_reason: Sierra reported monthly growth multiples and a cost trend without absolute figures or a method.
    valid_at: '2026'
    reported_by: Sierra
    metric_scope: Pinecone usage growth since April and reported falling costs; no absolute figures published
    category: adoption-output
    basis: reported-measurement
    subject: 'Pinecone usage growth since
      April with reported falling costs'
