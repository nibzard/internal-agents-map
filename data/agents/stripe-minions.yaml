claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source explicitly states that humans review and approve production pull requests.
    valid_at: '2026-02-20'
  lessons_learned.produce-changes-unattended-return-engineer-review:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Part 1 distinguishes unattended implementation from human PR review and explicitly describes
      another instruction cycle when the result is insufficient.
  lessons_learned.starts-minions-prewarmed-devboxes-recent-copies:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Part 2 describes proactive repository cloning and environment setup; it does not say the
      agent chooses the repository or provisions its own workspace.
  headline_metric:
    metric_scope: Weekly merged PRs completely produced by Minions; Part 2 report, up from Part 1
    confidence: medium
    confidence_reason: Stripe reports merged PR volume without an independent count or measurement window; Part
      2 is explicitly later than Part 1.
    category: adoption-output
    basis: reported-measurement
    subject: 'Weekly merged minion-produced
      PRs at Stripe, human-reviewed, per the Part 2 report'
  key_metrics.completely-minion-produced-prs-merged:
    metric_scope: Weekly merged PRs completely produced by Minions; earlier Part 1 report
    confidence: medium
    confidence_reason: Stripe reports merged PR volume without an independent count or measurement window; no calendar
      metric date appears in the capture.
    category: adoption-output
    basis: reported-measurement
    subject: 'Weekly merged minion-produced
      PRs at Stripe, per the earlier Part 1 report'
  architecture.context_mgmt:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Part 1 states the pre-run MCP hydration and Part 2 states the subdirectory-scoped rule files
      and blueprint-level context control directly.
