# yaml-language-server: $schema=../agent.schema.json
id: stripe-minions
company: Stripe
agent_name: Minions
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: stripe-minions-source-1
last_reviewed_at: '2026-09-16'
featured: true
status: internal
domains:
- coding
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: coding task → pull request handed to an engineer for review
  attention_boundary: work-product-review
rubric:
  invocation:
  - background
  - interactive
  evidence_strength: detailed-primary
summary: Homegrown one-shot coding agents that read work context, implement a change
  end-to-end, and produce a PR for human review.
headline_metric: Over 1,300 completely minion-produced PRs merged per week in Part 2, with human review and no human-written
  code
architecture:
  sandbox: Pre-warmed AWS EC2 devboxes in the QA environment, isolated from real user data, production services,
    and arbitrary network egress
  harness: Fork of Block's goose, orchestrated by code-defined blueprints that interleave agent loops with deterministic
    lint, git, and CI steps
  interfaces:
  - slack
  - github
  - cli
  - web
  - internal-ui
  tool_access: Curated subsets of Toolshed MCP tools for internal documentation, tickets, build status, and code
    intelligence; security controls constrain destructive actions
  knowledge: Repository-scoped rule files shared with human-operated coding agents, plus internal context fetched
    through MCP
  credentials: Full permissions inside quarantined devboxes; MCP security controls limit destructive actions, and
    production pull requests require human review
  context_mgmt: Subdirectory-scoped rule files attach as the agent traverses the filesystem, relevant MCP tools run
    over links before the run starts, and blueprint nodes can constrain tools or simplify each subagent's context
primitives:
- id: one-shot-end-to-end-agent
  name: One-shot end-to-end agent
  desc: Prepares a branch for human review and returns after a limited number of CI repair attempts
  role: mechanism
- {id: start-run-slack-internal-app, name: Start a run from Slack or an internal app, desc: 'An engineer tags the Slack app from the thread discussing
    a change, or starts a minion from the CLI, the web interface, or an integrated internal tool such as the
    flaky-test ticketing UI', role: workflow}
- {id: hydrate-context-before-the-run, name: Hydrate context before the run, desc: 'Relevant MCP tools run deterministically over likely-looking links
    before the run starts, and rule files scoped to subdirectories attach as the agent traverses the filesystem', role: workflow}
- {id: implement-task-prewarmed-devbox, name: Implement the task in a prewarmed devbox, desc: 'The blueprint''s agent nodes implement the change in an
    isolated devbox, interleaved with deterministic lint, git, and push nodes', role: workflow}
- {id: repair-ci-failures-bounded-loop, name: Repair CI failures within a bounded loop, desc: 'After a push, CI applies autofixes and sends unfixable
    failures back once for local repair; after at most two CI rounds the branch returns to its human operator', role: validation}
- {id: open-pull-request-human-review, name: Open the pull request for human review, desc: 'The minion prepares a pull request following Stripe''s PR
    template; the engineer opens it and requests review, or sends further instructions that push updated code', role: workflow}
key_metrics:
- id: completely-minion-produced-prs-merged
  text: Over 1,000 completely minion-produced PRs merged per week in Part 1, with human review and no human-written code
lessons_learned:
- id: produce-changes-unattended-return-engineer-review
  text: Stripe's Minions produce changes unattended, then return them for engineer review; failed runs can receive
    further instructions.
- id: starts-minions-prewarmed-devboxes-recent-copies
  text: Stripe starts Minions in prewarmed devboxes with recent copies of its main repositories and prepared development
    services.
