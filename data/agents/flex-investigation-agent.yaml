# yaml-language-server: $schema=../agent.schema.json
id: flex-investigation-agent
company: Flex
agent_name: AI Investigation Agent
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026'
  source_id: flex-investigation-agent-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- finance-ops
- on-call
- coding
autonomy: drafts-reviewed
operating_models:
- scope: payment investigation → proposed code fix
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  evidence_strength: detailed-primary
summary: Flex runs an internal Slack agent that support, operations, and engineering use to debug HSA and FSA payment
  problems. Given an email, order number, or error string, it traces the transaction across systems and answers in
  plain English. On high-confidence bugs it opens a pull request for review.
architecture:
  harness: Investigation-to-fix loop running as a serverless application on Modal; Slack requests are acknowledged,
    the investigation runs in a spawned background function, and fixes come from a spawned coding sub-agent
  model: Anthropic (named for the tool-calling investigation loop and the coding sub-agent); specific model version
    not named
  interfaces:
  - slack
  tool_access: Traces a payment end-to-end across payment systems; can open a PR with a proposed fix when a bug
    is found
  context_mgmt: Follow-up questions continue in the same Slack thread with full context; investigation length and
    thread depth are capped
primitives:
- id: investigation-to-fix-loop
  name: Investigation-to-fix loop
  desc: Payment trace → root-cause hypothesis → proposed code fix as a PR
  role: mechanism
- {id: resolve-identifier-walk-transaction, name: Resolve the identifier and walk the transaction, desc: 'A universal resolver maps an email, order number,
    transaction ID, or ticket to the relevant records, and the agent walks the transaction lifecycle across payments,
    refunds, consultations, webhooks, and payouts', role: workflow}
- {id: dig-into-the-failing-path, name: Dig into the failing path, desc: 'When something looks wrong the agent pulls provider responses and
    real-time payment state, searches production logs, and inspects error traces and the source code around the
    failure', role: workflow}
- {id: assess-confidence-before-acting, name: Assess confidence before acting, desc: 'The agent verifies the failure mode in the affected code path and
    assesses its confidence before taking any action', role: workflow}
- {id: spawn-coding-sub-agent-high-confidence, name: Spawn the coding sub-agent for a high-confidence fix, desc: 'The agent creates an engineering ticket and
    a coding sub-agent clones the repository, applies the fix, and opens a pull request posted back to the Slack
    thread', role: workflow}
- {id: run-validation-pipeline-pull-request, name: Run the validation pipeline before the pull request, desc: 'The coding sub-agent runs compile checks,
    linting, formatting, and tests before opening the pull request', role: validation}
key_metrics:
- id: routine-investigations-compressed-minutes-engineering-time
  text: Flex reports routine investigations compressed from about 20 minutes of engineering time to seconds
lessons_learned:
- id: retains-investigation-audit-records-tool-traces
  text: Flex retains investigation audit records and tool traces that engineers can inspect when a diagnosis is incomplete
    or wrong.
- id: routes-high-confidence-diagnoses-coding-sub
  text: Flex routes high-confidence diagnoses to a coding sub-agent and PR review, medium-confidence cases to an
    engineering ticket, and inconclusive cases to a report.
