claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source describes a trace, diagnosis, and proposed pull request returned for review.
    valid_at: '2026'
  lessons_learned.retains-investigation-audit-records-tool-traces:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The audit section distinguishes the query, timing, and response log from the reasoning
      and tool trace; these records support inspection rather than prove correctness.
  lessons_learned.routes-high-confidence-diagnoses-coding-sub:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The three confidence branches are described explicitly, including validation before a
      PR and the prohibition on the agent merging or deploying.
  key_metrics.routine-investigations-compressed-minutes-engineering-time:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Flex states the before-and-after in its own engineering blog without measured timings or a
      defined sample of investigations.
    metric_scope: Routine HSA and FSA payment investigations handled by the internal agent
    category: cost-latency
    basis: qualitative
    subject: 'Routine HSA and FSA payment investigations
      handled by the internal agent'
