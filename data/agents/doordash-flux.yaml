# yaml-language-server: $schema=../agent.schema.json
id: doordash-flux
company: DoorDash
agent_name: Flux
approach_type: platform
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: doordash-flux-source-3
last_reviewed_at: '2026-09-17'
status: internal
domains:
- code-review
- coding
- ci-triage
- on-call
- maintenance
autonomy: drafts-reviewed
operating_models:
- scope: engineering task → reviewed agent output
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  - interactive
  - scheduled
  evidence_strength: detailed-primary
summary: Flux is DoorDash’s cloud platform for engineering agents. It supplies isolated sandboxes, a governed MCP
  gateway, reusable playbooks and invocation surfaces. DoorDash’s analytics AI Marketplace is a separate documented
  platform.
headline_metric: 130,000 engineering tasks automated in one month
architecture:
  sandbox: Firecracker microVMs; <5s p95 end-to-end setup (boot, clone repos, install tools, configure harness)
  harness: 'Separate analytics AI Marketplace context (not a Flux capability): Maturity model: deterministic workflows
    → ReAct agents → hierarchical deep agents → experimental swarms'
  interfaces:
  - slack
  - github
  - scheduled
  - cli
  - skill
  tool_access: Flux Agent Gateway brokers playbook-declared tools with scoped, logged permissions. The separately
    documented analytics AI Marketplace uses LangGraph and explores A2A.
  knowledge: Flux playbooks package DoorDash-specific context. The separate analytics AI Marketplace hosts DataExplorer.
  credentials: Scoped per playbook; brokered through the gateway, never on the laptop; provenance on every action
  context_mgmt: 'Separate analytics AI Marketplace context (not a Flux capability): Hybrid retrieval: BM25 + dense
    semantic + reciprocal-rank fusion → RAG; schema-aware SQL with EXPLAIN validation'
primitives:
- id: sandbox
  name: Sandbox
  desc: Isolated Firecracker microVM with repos, tools, secrets, runtime deps
  role: mechanism
- id: mcp-gateway
  name: MCP Gateway
  desc: Governed, audited access to CI, observability, issue trackers, deploy, code search
  role: mechanism
- id: playbook
  name: Playbook
  desc: 'YAML unit of agentic work: task, inputs, skills, tools, permissions, validation, outputs'
  role: mechanism
- id: dataexplorer
  name: DataExplorer
  desc: 'Separate analytics AI Marketplace context (not a Flux capability): Identifies schemas, generates grounded
    SQL, validates via EXPLAIN before execution'
  role: mechanism
- id: maturity-model
  name: Maturity model
  desc: 'Separate analytics AI Marketplace context (not a Flux capability): Deterministic workflows and single agents
    are in use; deep agents are being developed and tested; swarms remain research'
  role: mechanism
- id: answer-a-grounded-data-question
  name: Answer a grounded data question
  desc: 'Separate analytics AI Marketplace context (not a Flux capability): From a business question, DataExplorer
    identifies candidate tables through DescribeTable with cached column examples, generates starter SQL grounded
    in the schema, and EXPLAIN validation with autocorrection precedes execution'
  role: workflow
key_metrics:
- id: engineering-tasks-automated-one-month
  text: 130,000 engineering tasks automated in one month
- id: automated-code-reviews-per-week
  text: 25,000+ automated code reviews per week
- id: playbooks-invocations-per-week
  text: 300+ playbooks; 10,000+ invocations per week
lessons_learned:
- id: first-used-flux-code-review-expanded
  text: DoorDash first used Flux for code review, then expanded into CI triage, on-call work, maintenance, and ticket-driven
    development.
- id: credits-move-private-run-channels-public
  text: DoorDash credits a move from private run channels to public Slack threads with helping teams learn to use Flux.
- id: ran-workshops-hackathons-help-teams-turn
  text: DoorDash ran workshops and hackathons to help teams turn recurring operational tasks into Flux playbooks.
- id: deterministic-workflows-single-agents-use-deep
  text: DoorDash reports deterministic workflows and single agents in use, deep agents under development, and swarms as
    research on its analytical platform.
- id: analytical-platform-uses-sql-linting-explain
  text: DoorDash's analytical platform uses SQL linting and EXPLAIN checks, with separate model judges for response quality.
- id: recording-queries-documents-agent-interactions-behind
  text: DoorDash describes recording the queries, documents, and agent interactions behind an analytical answer.
