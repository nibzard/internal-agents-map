claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The platform spans several workflows; the cited engineering examples retain human review
      of agent output.
    valid_at: '2025-11-11'
  lessons_learned.first-used-flux-code-review-expanded:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Flux retrospective lists the initial workflow and later uses; the sequence alone does
      not prove that this rollout order caused adoption.
  lessons_learned.credits-move-private-run-channels-public:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The authors describe the visibility change and its observed adoption pattern, without a controlled
      comparison of channel choices.
  lessons_learned.ran-workshops-hackathons-help-teams-turn:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective names these activities and the work they supported, rather than reporting
      that a playbook library appeared automatically.
  lessons_learned.deterministic-workflows-single-agents-use-deep:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The architecture article distinguishes these deployment stages. Its swarm discussion identifies
      governance and explainability as unresolved work.
  lessons_learned.analytical-platform-uses-sql-linting-explain:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The validation sections distinguish query checks from LLM-as-judge and DeepEval assessments;
      a valid query is not proof of a correct business answer.
  lessons_learned.recording-queries-documents-agent-interactions-behind:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The provenance discussion names these records as the audit trail; recording them does not
      itself establish that the answer is correct.
  headline_metric:
    metric_scope: Engineering tasks automated in one reported month; calendar measurement month unspecified
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report of a one-month count; this is the observation date, not the
      measurement window.
    category: adoption-output
    basis: reported-measurement
    subject: Engineering tasks automated on Flux in one reported month; the calendar month is unspecified
  key_metrics.engineering-tasks-automated-one-month:
    metric_scope: Engineering tasks automated in one reported month; calendar measurement month unspecified
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report of a one-month count; this is the observation date, not the
      measurement window.
  key_metrics.automated-code-reviews-per-week:
    metric_scope: Weekly automated code reviews powered by Flux
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report; weekly measurement boundaries are not supplied.
    category: adoption-output
    basis: reported-measurement
    subject: Weekly automated code reviews powered by Flux; the reviewer agent itself is the separate doordash-code-review
      record
  key_metrics.playbooks-invocations-per-week:
    metric_scope: Unique playbooks and weekly invocations on Flux
    category: adoption-output
    basis: reported-measurement
    subject: Unique Flux playbooks and weekly playbook invocations
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - doordash-flux-source-1
  - doordash-flux-source-2
  - doordash-flux-source-3
  workflow_scope: Business question to grounded, validated answer on the analytics platform
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.answer-a-grounded-data-question
      note: Historical analytics example retained for anchor compatibility; it belongs to DataExplorer on the separate
        AI Marketplace, not Flux.
    human_involvement:
      state: not-applicable
      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.answer-a-grounded-data-question
      - lessons_learned.analytical-platform-uses-sql-linting-explain
      note: The analytics platform validates generated SQL with linting, EXPLAIN checks, and statistical-metadata
        checks with autocorrection, plus a separate LLM-as-judge and DeepEval framework. Flux playbooks package
        validation per playbook.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: 'No model or provider is named for either platform. The sources describe modular primitives that
        allow the best third-party tool or an in-house build for each job, with multiple supported coding
        agent harnesses.'
    harness:
      note: The maturity model is the analytics platform's progression. Flux supports multiple coding agent harnesses
        inside its sandboxes.
    sandbox:
      note: Firecracker microVMs with a sub-five-second p95 end-to-end setup objective; a Flux capability.
    tool_access:
      note: Flux Agent Gateway with playbook-scoped logged permissions; LangGraph orchestration and prospective
        A2A on the analytics platform.
    context_mgmt:
      note: Hybrid retrieval and schema-aware SQL generation; an analytics-platform capability.
    credentials:
      note: Scoped per playbook and brokered through the gateway rather than the laptop; a Flux capability with
        provenance on every action.
    interfaces:
      note: Flux invocation surfaces are Slack, GitHub, cron, CLI, and skill; the analytics platform adds Cursor.
        The analytics conversational web UI is not claimed.
  aliases:
    key_metrics.engineering-tasks-automated-one-month:
      duplicate_of: headline_metric
      reason: 'Identical statement, scope, period, and locators as the headline: the same 130,000-task one-month
        count.'
