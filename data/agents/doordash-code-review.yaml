# yaml-language-server: $schema=../agent.schema.json
id: doordash-code-review
company: DoorDash
agent_name: AI Code Review Agent
relationships:
- type: component-of
  approach_id: doordash-flux
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: doordash-code-review-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: pull request → AI review comments
  attention_boundary: work-product-review
rubric:
  invocation:
  - background
  - event-driven
  evidence_strength: detailed-primary
summary: A specialized agent that automatically reviews 10,000+ PRs a week across 56 repositories, emphasizing grounded
  high-confidence findings over noisy comments.
headline_metric: 10,000+ pull requests reviewed per week across 56 repositories
architecture:
  harness: Three architecture versions; emphasis on attention and grounded, high-confidence findings rather than
    commenting everywhere
  interfaces:
  - github
  tool_access: Reviews Go, iOS, Android, web, infrastructure, and data code
  knowledge: Grounded findings tied to evidence
primitives:
- id: grounded-findings
  name: Grounded findings
  desc: Filters review candidates for evidence, confidence, and an actionable file-and-line location
  role: mechanism
- {id: automatic-review-trigger, name: Automatic review trigger, desc: Opening a pull request can automatically start the review alongside human reviewers, role: workflow}
- {id: lead-scout, name: Lead scout, desc: A scout reads the diff and produces focused investigation leads without trying to verify them, role: workflow}
- {id: deep-reviewers, name: Deep reviewers, desc: Two reviewers investigate the scout's leads and drop the ones that do not hold up, role: workflow}
- {id: disprove-it-pass, name: Disprove-it pass, desc: Before publication the system tries to falsify each candidate finding and drops claims that do not survive, role: validation}
- {id: optional-fixer, name: Optional fixer, desc: "A person can tag the agent on a review comment; a remote VM applies the requested change and pushes a reviewable commit to the pull request", role: workflow}
- {id: evaluation-loop, name: Evaluation loop, desc: Changes are tested on real past review misses and high-severity incidents before production acceptance data is checked, role: validation}
key_metrics:
- id: prs-reviewed-typical-week-repositories
  text: 10,000+ PRs reviewed in a typical week across 56 repositories
- id: action-rate-settled-high-critical-findings
  text: 60.2% action rate on settled high/critical findings (measured sample)
- id: average-cost-per-review
  text: Roughly $3 average cost per review
- id: findings-posted-minutes-pull-request-opens
  text: Findings posted about 7 minutes after a pull request opens on average
lessons_learned:
- id: favors-fewer-actionable-review-comments-accepting
  text: DoorDash favors fewer actionable review comments, accepting that this policy will miss some issues.
- id: acceptance-rate-describes-how-engineers-use
  text: DoorDash's reported acceptance rate describes how engineers use published findings; it cannot count issues
    the reviewer missed.
sources:
- id: doordash-code-review-source-1
  title: How DoorDash built an AI code reviewer engineers actually listen to
  url: https://careersatdoordash.com/blog/doordash-built-an-ai-code-reviewer-engineers-actually-listen-to/
  kind: engineering-blog
  provenance_class: first-party
  accessed_at: '2026-08-12'
  last_verified_at: '2026-08-31'
  capture:
    manifest_path: archive/sources/doordash-code-review-source-1/metadata.json
evidence:
