  architecture.knowledge:
  - source_id: doordash-code-review-source-1
  primitives.grounded-findings:
  - locator: Preserved content.md, lines 56-68,166
  primitives.automatic-review-trigger:
  - {locator: 'Preserved content.md, line 23'}
  primitives.lead-scout:
