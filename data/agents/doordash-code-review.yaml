claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source describes automated findings that engineers evaluate within the pull-request workflow.
    valid_at: '2026'
  lessons_learned.favors-fewer-actionable-review-comments-accepting:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The precision-over-recall section states the tradeoff; the later comment-quality discussion
      requires a concrete file, line, and action point.
  lessons_learned.acceptance-rate-describes-how-engineers-use:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The report ties acceptance to its precision-first policy. A denominator of published comments
      does not measure recall over all defects.
  headline_metric:
    metric_scope: Typical weekly PR reviews across 56 onboarded repositories
    category: adoption-output
    basis: reported-measurement
    subject: Typical weekly reviews across 56 repositories
  key_metrics.prs-reviewed-typical-week-repositories:
    metric_scope: Typical weekly PR reviews across 56 onboarded repositories
  key_metrics.action-rate-settled-high-critical-findings:
    metric_scope: Settled high and critical findings that led to code changes before merge
    denominator: 2,256 settled high and critical findings
    measurement_method: Whether the human changed the code before merge in response to the finding
    category: effectiveness
    basis: reported-measurement
    subject: Settled high and critical findings that led to code changes
  key_metrics.average-cost-per-review:
    confidence: medium
    confidence_reason: DoorDash reports its current average review cost without an independent audit.
    metric_scope: Average cost of the current staged review workflow
    unit: USD per review
    category: cost-latency
    basis: reported-measurement
    subject: Average cost of the current review workflow
  key_metrics.findings-posted-minutes-pull-request-opens:
    confidence: medium
    confidence_reason: DoorDash reports average posting latency without a distribution or independent audit.
    metric_scope: Time from pull-request opening to a posted finding
    unit: minutes
    category: cost-latency
    basis: reported-measurement
    subject: Average time from PR opening to a posted finding
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [doordash-code-review-source-1]
  workflow_scope: Pull request opening → staged review → published finding and optional fix
  questions:
    purpose: {state: reported}
    workflow: {state: reported, claim_paths: [primitives.automatic-review-trigger, primitives.lead-scout, primitives.deep-reviewers, primitives.optional-fixer]}
    human_involvement: {state: reported, claim_paths: [operating_models.0, primitives.optional-fixer]}
    implementation: {state: reported}
    validation: {state: reported, claim_paths: [primitives.disprove-it-pass, primitives.evaluation-loop]}
    observations: {state: reported}
    lessons: {state: reported}
  implementation_fields:
    model: {state: unreported, note: 'The source says the design is model-agnostic but names
      no current model.'}
    sandbox: {state: unreported, note: "The remote VM is documented, but its isolation guarantees are not."}
  aliases:
    key_metrics.prs-reviewed-typical-week-repositories: {duplicate_of: headline_metric, reason: "Same review count, repository population, period, and qualification as the headline observation."}
