claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source explicitly frames diffs, branches, and pull requests as reviewable outputs.
    valid_at: '2026'
  lessons_learned.returns-branches-diffs-summaries-run-history:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The platform introduction and execution flow name reviewable artifacts and a human decision
      point when a run fails.
  lessons_learned.identifies-coordination-ownership-retained-context-challenges:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The authors frame these as engineering challenges and describe a durable run as their response;
      they do not quantify a shift in review bottlenecks.
  lessons_learned.keeps-spectre-security-agents-separate-infrastructure:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The security article explains that sharing detection knowledge and investigation memory would
      expose information valuable to an attacker; this is Harvey's design rationale.
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - harvey-spectre-source-1
  - harvey-spectre-source-2
  workflow_scope: Request from Slack, the web app, an automation, or the CLI through a sandboxed durable run to
    reviewable artifacts
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.start-a-durable-run
      - primitives.execute-the-agent-in-the-sandbox
      - primitives.return-reviewable-artifacts
      note: 'The named run is the first-version flow the post documents: create a run, start a fresh sandbox, hydrate
        the repository, run the agent, stream output, persist artifacts.'
    human_involvement:
      state: not-applicable
      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.scheduled-verification-loops
      note: Verification loops run as scheduled ordinary runs; the post documents no separate check inside an interactive
        run beyond the review boundary.
    observations:
      state: unreported
      note: The platform post reports no measured outcomes. The security article's figures describe the separate
        agentic SOC, which runs on its own infrastructure by design.
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: 'The post describes provider adapters and multi-provider support but names no model.'
    knowledge:
      state: unreported
      note: No knowledge store for Spectre runs is documented; the SOC's memory system belongs to the separate security
        platform.
    interfaces:
      note: The CLI joins Slack, the web app, and automations as a surface over the same durable run.
