# yaml-language-server: $schema=../agent.schema.json
id: harvey-spectre
company: Harvey
agent_name: Spectre
approach_type: platform
deployment_stage: deployed
first_public_evidence:
  date: '2026'
  source_id: harvey-spectre-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
- code-review
- on-call
- security
autonomy: drafts-reviewed
operating_models:
- scope: request from Slack, the web app, or an automation → reviewable diff or pull request
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  - background
  - scheduled
  evidence_strength: detailed-primary
summary: Harvey's internal collaborative cloud agent platform; turns requests from Slack, the web app, or automations
  into durable runs that return reviewable summaries, diffs, branches, and PRs.
architecture:
  sandbox: Isolated ephemeral execution environments; durable runs
  harness: Collaborative cloud agent platform with explicit boundaries around GitHub, Datadog, Linear, and other
    connected systems
  interfaces:
  - slack
  - web
  - automation
  - cli
  tool_access: Explicit tool boundaries; tool configuration injected at run start; requests start from Slack, the
    web app, or automations; connects to systems like GitHub, Datadog, and Linear
  credentials: Short-lived, scoped credentials injected at run start; no ambient access to the control plane or
    a user's machine
  context_mgmt: Durable runs over disposable execution environments
primitives:
- id: durable-runs-ephemeral-execution
  name: Durable runs / ephemeral execution
  desc: Long-lived run state over throwaway compute
  role: mechanism
- id: reviewable-artifacts
  name: Reviewable artifacts
  desc: Returns summaries, diffs, branches, and pull requests alongside the run history
  role: mechanism
- id: start-a-durable-run
  name: Start a durable run
  desc: A request from Slack, the web app, an automation, or the CLI creates a durable run and starts a fresh sandbox
    that hydrates the repository
  role: workflow
- id: execute-the-agent-in-the-sandbox
  name: Execute the agent in the sandbox
  desc: The worker runs the agent, streams output, and reaches approved external systems through tool configuration
    injected at run start
  role: workflow
- id: return-reviewable-artifacts
  name: Return reviewable artifacts
  desc: The run persists summaries, diffs, branches, and pull requests; a failed run returns the result to a person
    who decides what happens next
  role: workflow
- id: scheduled-verification-loops
  name: Scheduled verification loops
  desc: Cron-based automations materialize ordinary runs for cleanup passes, test generation, dependency checks,
    and verification loops
  role: validation
lessons_learned:
- id: returns-branches-diffs-summaries-run-history
  text: Spectre returns branches, diffs, summaries, and run history so another person can inspect or continue the work.
- id: identifies-coordination-ownership-retained-context-challenges
  text: Harvey identifies coordination, ownership, and retained context as challenges when many people and agents share
    work.
- id: keeps-spectre-security-agents-separate-infrastructure
  text: Harvey keeps Spectre and its security agents on separate infrastructure to limit the consequences of a compromised
    product agent.
