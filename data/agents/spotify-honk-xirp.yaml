claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source documents automated verification followed by a pull-request workflow that retains
      human review.
    valid_at: '2025'
  headline_metric:
    metric_scope: Cumulative merged Honk-generated PRs reported in Part 1; no measurement cutoff in preserved text
    measurement_method: Company-reported merged pull request count
    category: adoption-output
    basis: reported-measurement
    subject: Cumulative merged Honk-generated pull requests across Spotify
  key_metrics.merged-ai-generated-prs-honk:
    metric_scope: Cumulative merged Honk-generated PRs reported in Part 1; no measurement cutoff in preserved text
  key_metrics.time-savings-migrations-vs-manual:
    metric_scope: Selected code migrations using Honk compared with writing the changes manually
    denominator: Manual completion time for the same migration work
    category: effectiveness
    basis: reported-measurement
    subject: Selected code migrations executed with Honk against manual completion time
  key_metrics.half-spotify-prs-automated-fleet-management:
    valid_at: '2024'
    metric_scope: Fleet Management automated pull requests since mid-2024, including deterministic transforms
    denominator: All Spotify pull requests
    category: adoption-output
    basis: estimate
    subject: Spotify pull requests automated by Fleet Management since mid-2024 including deterministic transformations
  lessons_learned.coding-cli-combines-formatting-linting-separate:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Honk article lists both the deterministic tasks and LLM diff evaluation; neither is reported
      as a substitute for all other validation.
  lessons_learned.runs-kubernetes-pods-uses-trusted-tools:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The later Spotify account identifies the execution environment and build tools, but does
      not document the credential boundary asserted by the previous lesson.
  lessons_learned.exposes-backstage-ownership-documentation-through-tools:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The developer-experience section describes catalog access and lint feedback. It supports
      these concrete uses, not a requirement that every company adopt Backstage first.
  lessons_learned.supplying-service-ownership-documentation-architecture-context:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Xirp product page names those context sources; it does not establish a connection to
      Honk or quantify a productivity multiplier.
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - spotify-honk-xirp-source-1
  - spotify-honk-xirp-source-2
  - spotify-honk-xirp-source-3
  workflow_scope: Natural-language change request → Honk pull request through Fleet Management
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.describe-the-change-as-a-prompt
      - primitives.honk-executes-the-code-change
      - primitives.open-pull-request-through-existing-workflow
    human_involvement:
      state: unreported
      note: The captures keep reviews and merges on the pre-agent pull-request workflow (Honk Part 1 lines 26 and
        58) without stating a required human checkpoint for Honk pull requests; the no-human auto-merge statement
        covers deterministic Fleetshift pull requests only (Code with Claude line 36).
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.deterministic-and-model-based-verification
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    sandbox:
      note: 'The isolation boundary inside the pods and containers is not stated; sandboxing is named as an
        open challenge (Honk Part 1 line 101).'
    credentials:
      state: unreported
      note: Credential handling for Honk sessions and their trusted tools is not documented in the reviewed captures.
  aliases:
    key_metrics.merged-ai-generated-prs-honk:
      duplicate_of: headline_metric
      reason: Same cumulative merged Honk pull-request count period and scope as the headline observation.
