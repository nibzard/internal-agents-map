id: snowflake-coding-agents
company: Snowflake
agent_name: Internal coding agents (CoCo / Cortex Code)
approach_type: agent-system
deployment_stage: scaled
year: 2026
first_public_evidence:
  date: '2026-07'
  source_id: snowflake-coding-agents-source-1
last_reviewed_at: '2026-08-21'
status: internal
domains:
- coding
- code-review
- ci-triage
- on-call
autonomy: drafts-reviewed
operating_models:
- scope: 'coding request → reviewed pull request (inner loop)'
  attention_boundary: work-product-review
- scope: 'release validation blocker → agent-diagnosed fix pull request'
  attention_boundary: work-product-review
- scope: 'on-call alert → skill-guided agent investigation'
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  - event-driven
  state: cross-session-memory
  identity: unknown
  evidence_strength: limited-primary
summary: 'Snowflake''s organization-wide rollout of coding agents on its CoCo agent:
  unrestricted adoption first, then a shared vocabulary of about 14 design patterns,
  focus weeks, and roughly 7,000 versioned skills that extend the agent into release
  validation and on-call work.'
headline_metric: Release validation time down from 15 days to 1 day in 12 months (self-reported)
architecture:
  sandbox: 'Pattern 4, "fence your robots", runs parallel agents in separate git worktrees'
  harness: CoCo coding agent extended with versionable CI/CD skill workflows; teams
    share about 14 numbered AI design patterns
  interfaces:
  - github
  - slack
  - ci
  - webhook
  tool_access: Skills encode operational workflows, including a blast-radius skill
    that lists affected customers
  knowledge: Tribal knowledge encoded in about 7,000 skills written by about 1,000
    engineers; profiles group skills by domain, such as streaming debugging
  context_mgmt: Pattern 8 keeps the orchestrator context small and delegates work
    to an agent team
primitives:
- name: Skills
  desc: Versionable CI/CD workflows that replace runbooks and extend the CoCo coding
    agent
- name: Profiles
  desc: Units that group skills for a domain, such as the skill set needed to debug
    a streaming issue
- name: AI design patterns
  desc: A numbered internal vocabulary of about 14 effective coding-agent practices,
    disseminated with an XKCD comic
- name: Memory promotion
  desc: Overnight promotion of agent memory into shared skills so the system improves
    with use
key_metrics:
- 97% of engineers are weekly active coding-agent users (mid-2026)
- Code volume up about 1.5X year over year and about 3X over three years
- Test volume up about 3X; the source also cites 3.5X
- Release validation time down from 15 days to 1 day in 12 months
- About 1,000 engineers have written about 7,000 skills
- Keep-the-lights-on (KTLO) work is about 30% of engineering effort, with a target
  of 5%
- Compiler rewrite by a tech lead, three engineers, and coding agents reported about
  40X improvement
lessons_learned:
- Let unrestricted use run before imposing standards; measure adoption, not lines
  of code or pull-request counts
- Codify effective use into a shared pattern vocabulary before pushing organization-wide
  practice
- Give both groups dedicated time; focus weeks serve the 95% who follow paved paths
  and the 5% who explore
- Encode runbooks as versionable skills rather than documents that age quickly
- Promote agent memory into shared skills so individual learning becomes tribal knowledge
- Meet pioneers, settlers, and skeptics where they are; expect a grief-like acceptance
  process
