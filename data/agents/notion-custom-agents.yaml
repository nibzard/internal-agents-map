summary: Custom Agents is Notion's platform for building agents in a Notion workspace, and Notion ships it internally
  first. Staff in IT ticketing, supply chain procurement, and recruiting build their own agents. One early internal
  agent triages bugs posted in Slack into task-database entries.
headline_metric: More than 3,000 internal Custom Agents by end of alpha testing
architecture:
  harness: Shared Custom Agents harness with team-owned tools and evaluations
  tool_access: Agents start without access; owners grant resource and tool permissions for the intended work
  interfaces:
  - slack
  knowledge: Workspace pages and connected resources granted to the individual agent
  credentials: Deterministic resource and action permissions; risky runtime actions require owner confirmation
  context_mgmt: Tool definitions and progressive disclosure expose capabilities as needed
primitives:
- id: slack-bug-triage-agent
  name: Slack bug-triage agent
  desc: A documented internal agent receives a bug posted in Slack, routes it to the responsible team, creates a
    task-database entry, and replies in the triggering channel
  role: workflow
- id: default-deny-permission-model
  name: Default-deny permission model
  desc: "Each Custom Agent starts without access to most resources and receives explicit page, integration, tool, and action permissions"
  role: mechanism
- id: risk-confirmation-and-remediation
  name: Risk confirmation and remediation
  desc: "Potentially risky runtime actions pause for confirmation from the agent owner, who can also delete an incorrect Slack message"
  role: validation
key_metrics:
