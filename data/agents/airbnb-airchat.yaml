# yaml-language-server: $schema=../agent.schema.json
id: airbnb-airchat
company: Airbnb
agent_name: Airchat (airchat-cli)
approach_type: platform
deployment_stage: scaled
first_public_evidence:
  date: '2025'
  source_id: airbnb-airchat-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: coding task → reviewed pull request
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  - background
  evidence_strength: mixed
summary: Airchat is Airbnb's internal agentic-coding harness, built by its Dev AI team as a wrapper over vendor
  coding agents such as Claude Code and Codex. The team first built its own orchestrator from scratch, never shipped
  it, and delegated to Airchat with a thin shim instead.
headline_metric: About 64% of pull requests materialized through agentic coding
architecture:
  harness: Wrapper over vendor coding agents with a unified gateway, an internal plugin marketplace, and AirDev
    parallel workspaces
  model: Vendor coding agents (Claude Code and Codex are named in use), wrapped by Airbnb
  tool_access: More than a dozen internal MCP servers connect agents to internal systems
  interfaces:
  - cli
  - web
  sandbox: AirDev remote workspaces run agent sessions network-isolated from production services and user data
  credentials: AirChat handles authentication and permissioning for internal agent use
  context_mgmt: AirChat loads default MCP servers into sessions, and the agent loop reads configuration files such
    as AGENTS.md and CLAUDE.md
primitives:
- id: start-an-agentic-coding-session
  name: Start an agentic coding session
  desc: An engineer writes a short spec or prompt that starts an autonomous coding session through AirChat
  role: workflow
- id: materialize-the-code-change
  name: Materialize the code change
  desc: The session calls LLMs and internal tools in a loop until it produces a complete code change
  role: workflow
- id: review-every-line-before-merge
  name: Review every line before merge
  desc: The loop ends at the diff; a human reviews every line of the change before it merges as a pull request
  role: workflow
key_metrics:
- id: pull-requests-materialized-through-agentic-coding
  text: About 64% of pull requests materialized through agentic coding
lessons_learned:
- id: wrap-vendor-coding-agents-thin-shim
  text: Wrap vendor coding agents with a thin shim instead of building a full orchestrator from scratch; Airbnb's own
    orchestrator never shipped
