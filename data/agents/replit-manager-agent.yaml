# yaml-language-server: $schema=../agent.schema.json
id: replit-manager-agent
company: Replit
agent_name: Manager agent (agent-of-agents)
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: replit-manager-agent-source-1
last_reviewed_at: '2026-09-17'
status: internal
domains:
- coding
- code-review
- support
- research
- data
autonomy: autonomous
operating_models:
- scope: objective → verifiable multi-agent work product
  attention_boundary: work-product-review
- scope: pull request → agent review with risk-gated human second reviewer
  attention_boundary: exception-only
rubric:
  invocation:
  - interactive
  evidence_strength: detailed-primary
summary: An internal agent-of-agents stack where every employee gets a manager agent that spawns multiple agents
  for verifiable work and escalates judgment to humans.
headline_metric: 2.9x code output for a consistent author cohort; review latency, PR reversions, and incident trends
  reported flat
architecture:
  sandbox: microVMs and remote filesystems behind access policies, token proxies, audit logging, and a ZeroTrust
    network
  harness: 'Fleet/loop orchestration: a manager agent launches parallel agents for verifiable work and escalates
    judgment'
  interfaces:
  - slack
  tool_access: Investigates incidents, reviews PRs, answers questions, analyzes company data, triages support, researches
    sales accounts, improves Replit Agent itself
  context_mgmt: Manager agent coordinates parallel sub-agents and routes results
  knowledge: Knowledge-base and codebase state, with a semantic layer over the data warehouse naming source-of-truth
    tables
  credentials: Tool access mediated by token proxies
primitives:
- id: manager-agent
  name: Manager agent
  desc: One human gives an objective; the manager spawns parallel agents for verifiable work and escalates judgment
  role: mechanism
- id: take-an-objective-and-gather-context
  name: Take an objective and gather context
  desc: The manager agent takes a goal from a person and gathers context across company systems
  role: workflow
- id: spawn-parallel-loop-agents
  name: Spawn parallel loop agents
  desc: It spawns multiple agents that work in loops on the verifiable task for the person
  role: workflow
- id: check-results-and-escalate-judgment
  name: Check results and escalate judgment
  desc: "Work results are checked, and human judgment is requested when needed"
  role: validation
key_metrics:
- id: code-output-consistent-author-cohort-early
  text: 2.9x code output for a consistent author cohort from early January to late June
- id: no-corresponding-deterioration-review-reversion-incident
  text: No corresponding deterioration in review/reversion/incident metrics
- id: human-pr-review-time-saved-growing
  text: 30% of human PR review time saved (and growing) in the agent review lane
- id: hardest-support-tickets-escalated-humans-closed
  text: Hardest support tickets, those escalated to humans, closed 60% faster
lessons_learned:
- id: gives-employees-manager-agent-delegate-verifiable
  text: Replit gives employees a manager agent that can delegate verifiable tasks to several agents, while human review
    remains part of its coding workflow.
- id: higher-code-output-alongside-flat-review
  text: Replit reports higher code output alongside flat review latency, reversion trends, and incident counts; those
    measures cover different aspects of the workflow.
