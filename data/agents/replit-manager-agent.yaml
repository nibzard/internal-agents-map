claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source describes autonomous parallel execution followed by human judgment on the resulting
      work; human code review remains a documented mode alongside the agent review lane.
    valid_at: '2026'
  operating_models.1:
    confidence: high
    confidence_reason: The source states the agent assesses risk levels and only calls in a second human reviewer
      when necessary inside the agent review lane.
    valid_at: '2026'
  lessons_learned.gives-employees-manager-agent-delegate-verifiable:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The manager-agent passage describes delegation; the review passages explicitly retain human
      co-review and risk-based requests for a second reviewer.
  lessons_learned.higher-code-output-alongside-flat-review:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The article reports these trends together but provides no controlled comparison or complete
      workload denominator, so it cannot establish unchanged quality for all additional output.
  headline_metric:
    metric_scope: Code output for a consistent author cohort across early January to late June; separate from company-wide
      hiring effects
    denominator: Same cohort of authors before and after
    measurement_method: Comparison of contributed code for a consistent author cohort; raw company-wide lines of
      code increased 5.8x
    category: effectiveness
    basis: reported-measurement
    subject: Code output for a consistent author cohort; company review latency, PR reversion rates, and incident
      trends
  key_metrics.code-output-consistent-author-cohort-early:
    metric_scope: Code output for a consistent author cohort across early January to late June; separate from company-wide
      hiring effects
    denominator: Same cohort of authors before and after
    measurement_method: Comparison of contributed code for a consistent author cohort; raw company-wide lines of
      code increased 5.8x
  key_metrics.no-corresponding-deterioration-review-reversion-incident:
    metric_scope: Company code review latency, PR reversion rates, and incidents opened during increased code output
    measurement_method: Company comparison of review latency, PR reversion rates, and incident trends
  key_metrics.human-pr-review-time-saved-growing:
    confidence: medium
    confidence_reason: Replit reported the saving in its own blog; the measurement method and window are not described.
    metric_scope: Human pull-request review time in the agent review lane; saved share stated as 30% and growing
    category: cost-latency
    basis: reported-measurement
    subject: Human pull-request review time in the agent review lane
  key_metrics.hardest-support-tickets-escalated-humans-closed:
    confidence: medium
    confidence_reason: Replit reported the figure in its own blog without a method or baseline description.
    metric_scope: Support tickets escalated to humans; closure time stated 60% faster
    category: cost-latency
    basis: reported-measurement
    subject: Closure time for support tickets escalated to humans
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - replit-manager-agent-source-1
  workflow_scope: Person's objective through parallel loop agents to verifiable work product
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.take-an-objective-and-gather-context
      - primitives.spawn-parallel-loop-agents
    human_involvement:
      state: reported
      claim_paths:
      - operating_models.0
      - operating_models.1
      note: Humans review the resulting work; in the agent review lane a second human reviewer joins only when the
        assessed risk makes one necessary.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.check-results-and-escalate-judgment
      note: The documented check is result-checking with escalation for judgment; the code-review lane separately
        pairs human reviews with an agentic co-reviewer.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    context_mgmt:
      note: Stated as coordination and routing of parallel sub-agents; no finer-grained context mechanism is documented.
    credentials:
      note: Stated at the level of token proxies; the capture gives no further credential mechanism.
    interfaces:
      note: A Slack interface carried adoption beyond engineering.
  aliases:
    key_metrics.code-output-consistent-author-cohort-early:
      duplicate_of: headline_metric
      reason: 'Component of the compound headline: the same 2.9x cohort figure with the period already stated in
        the headline metric scope.'
    key_metrics.no-corresponding-deterioration-review-reversion-incident:
      duplicate_of: headline_metric
      reason: 'Component of the compound headline: the same flat review-latency, reversion, and incident trends
        with the same company scope.'
