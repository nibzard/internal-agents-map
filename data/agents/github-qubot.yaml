id: github-qubot
company: GitHub
agent_name: Qubot
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: 2026-06
  source_id: github-qubot-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- data
autonomy: assistive
operating_models:
- scope: data question → warehouse answer
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  evidence_strength: detailed-primary
summary: GitHub's internal data-analytics agent, powered by GitHub Copilot. Employees ask questions about the
  company data warehouse in plain language.
headline_metric: Hundreds of users run thousands of queries; data questions in internal Slack channels dropped
architecture:
  model: Powered by GitHub Copilot
  harness: Copilot Cloud Agent running on github.com
  tool_access: Queries GitHub's data warehouse
  interfaces: [slack, cli]
  knowledge: Federated context contributed by teams and normalized into a structured context layer
  context_mgmt: A context agent ingests, organizes, and normalizes contributed context
primitives:
- {id: start-a-qubot-run, name: Start a Qubot run, desc: A question in the Qubot Slack channel spawns a Copilot Cloud Agent instance on github.com, role: workflow}
- {id: select-context-and-query-engine, name: Select context and query engine, desc: "The run uses the federated context layer and routes work to Kusto for recent exploratory data or Trino for complex historical analysis", role: workflow}
- {id: query-the-warehouse, name: Query the warehouse, desc: Qubot connects to Kusto and Trino through MCP servers and executes the data query, role: workflow}
- {id: return-answer-and-report, name: Return answer and report, desc: The answer appears in Slack for threaded refinement and the results are stored as a Markdown report in a pull request, role: workflow}
- {id: offline-evaluation-gate, name: Offline evaluation gate, desc: "Context and agent-configuration changes run against curated prompts, ground-truth SQL, accuracy, latency, and regression checks before shipping", role: validation}
key_metrics:
- id: hundreds-users-run-thousands-queries
