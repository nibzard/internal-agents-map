# yaml-language-server: $schema=../agent.schema.json
id: posthog-stamphog
company: PostHog
agent_name: StampHog
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026-07-09'
  source_id: posthog-stamphog-source-1
last_reviewed_at: '2026-09-16'
status: open-sourced
domains:
- code-review
autonomy: autonomous
operating_models:
- scope: eligible pull request → approval decision
  attention_boundary: exception-only
rubric:
  invocation:
  - background
  - event-driven
  evidence_strength: detailed-primary
summary: A GitHub-label-triggered PR approval agent that applies fail-closed deterministic safety gates, asks an
  LLM to check for showstoppers, autonomously approves eligible changes, and refuses or escalates the rest.
headline_metric: Handled 1,600 PRs in the previous month, as reported on July 9, 2026; roughly one in three merged
  main-repository PRs received its final approval during the reported quarter
architecture:
  harness: A GitHub Action invokes a Python pipeline that fetches and classifies a PR, applies hard gates, waits
    for in-flight reviewer bots, runs an LLM review, and posts a verdict
  model: Claude through the Claude Agent SDK, with Read, Grep, and Glob tools
  interfaces:
  - github
  - ci
  tool_access: Reads the diff and repository files plus trusted review-state, discussion, ownership, and reviewer
    signals
  knowledge: Repository-specific deny categories, size and risk tiers calibrated from prior human approvals, review
    guidance, and ownership data
  credentials: A dedicated Anthropic organization secret and a StampHog GitHub App token whose approvals satisfy
    branch protection
  context_mgmt: Each run emits a versioned JSON evidence bundle retained as a CI artifact for 30 days; a sticky
    GitHub comment carries non-approval verdict history and labels preserve retry state
primitives:
- id: authoritative-safety-gates
  name: Authoritative safety gates
  desc: Draft state, conflicts, requested changes, sensitive paths, size ceilings, and risk tiers can block AI approval;
    the LLM may tighten but never loosen a gate
  role: validation
- id: risk-aware-routing
  name: Risk-aware routing
  desc: Eligible changes can be approved while risky, ambiguous, or insufficiently assured changes are refused or
    escalated to a suitable human reviewer
  role: workflow
- id: auditable-verdict-bundle
  name: Auditable verdict bundle
  desc: Each run records PR metadata, classification, gate results, reviewer output, and the final verdict
  role: mechanism
- id: label-triggered-run-start
  name: Label-triggered run start
  desc: An engineer adds the stamphog label to a non-draft pull request and the GitHub Action runs the review pipeline
  role: workflow
- id: wait-out-in-flight-bot-reviews
  name: Wait out in-flight bot reviews
  desc: The run waits up to five minutes for allowlisted reviewer-bot reviews to finish and returns WAIT with the
    label kept when one is still in flight
  role: workflow
- id: llm-showstopper-review
  name: LLM showstopper review
  desc: Claude reads the diff, repository files, discussion timeline, and reviewer signals to look for production
    breakage, security issues, and missed dependencies
  role: workflow
- id: post-the-verdict
  name: Post the verdict
  desc: An approval is posted once as the StampHog app and counts toward branch protection; every other verdict updates
    one sticky comment with its reason and next steps
  role: workflow
key_metrics:
- id: prs-handled-autonomously-previous-month
  text: 1,600 PRs handled autonomously in the previous month, as reported on July 9, 2026
- id: one-three-prs-merged-posthog-main
  text: Roughly one in three PRs merged into PostHog's main repository received StampHog's final approval during the reported
    quarter
- id: prs-approved-stamphog-july
  text: 20% of PRs approved by StampHog in the July 28, 2026 report, at approximately $300 per month in tokens
lessons_learned:
- id: deterministic-eligibility-gates-remain-authoritative-model
  text: StampHog's deterministic eligibility gates remain authoritative; its model reviewer can impose stricter conditions
    but cannot relax those gates.
- id: calibrated-stamphog-thresholds-deny-categories-against
  text: PostHog calibrated StampHog's thresholds and deny categories against repository history, including small
    changes with sensitive effects.
- id: withholds-approval-backend-errors-pending-reviewer
  text: StampHog withholds approval on backend errors or pending reviewer-bot work and retains its label so a later
    push can retry.
