# yaml-language-server: $schema=../agent.schema.json
id: ramp-finance-agents
company: Ramp
agent_name: Doer and Architect
approach_type: agent-system
deployment_stage: deployed
first_public_evidence:
  date: '2025-10-01'
  source_id: ramp-finance-agents-source-1
last_reviewed_at: '2026-10-08'
status: internal
domains:
- finance-ops
autonomy: unknown
operating_models:
- scope: Accountant screen recording → reusable Process → completed spreadsheet
  attention_boundary: unknown
rubric:
  invocation:
  - background
  evidence_strength: detailed-primary
summary: Ramp Labs pairs an internal finance agent (the Doer), which executes spreadsheet
  accounting workflows such as monthly revenue reconciliation and month-end inter-company
  transfers into ERP, with a second agent (the Architect) that watches screen recordings
  of accountants and writes the prompts and context files the Doer needs.
headline_metric: Tasks that took 1-2 hours complete in under 10 minutes, a reported 6-12x speedup
architecture:
  harness: A two-agent pipeline in which the Architect compiles a reusable Process of steps,
    required files, and context, and hands it to the Doer to execute; the Doer relies on
    model intelligence with minimal guide rails
  model: Architect uses Gemini 2.5 Pro with a 1M-token context window; Doer uses Claude
    Sonnet 4.5
  tool_access: The Doer uses specialized tools to search, manipulate, and validate spreadsheet
    operations; workloads combine invoice and data-warehouse data, several tools, Excel
    workbooks, and ERP journal-entry import
  knowledge: A Process is a compiled set of steps, required files, and additional information
    such as temporal dependencies, reusable across runs
primitives:
- {id: architect-watches-recording, name: Architect watches a screen recording, desc: 'An accountant uploads a screen recording; the Architect extracts the workflow, the required files, and temporal dependencies, and generates a structured prompt', role: workflow}
- {id: compile-reusable-process, name: Compile a reusable Process, desc: 'The Architect compiles steps, required files, and context into a Process that later runs reuse', role: mechanism}
- {id: doer-executes-process, name: Doer executes the Process, desc: 'The Doer receives the Process and uploaded files, manipulates the spreadsheets, and returns a completed spreadsheet', role: workflow}
- {id: validation-checks-per-instruction, name: Validation checks per instruction, desc: 'The Doer runs validation checks as it executes each instruction', role: validation}
key_metrics:
- id: spreadsheetbench-soft-restriction
  text: 49.5% accuracy on SpreadsheetBench soft-restriction tasks, tested on about 50 randomly
    selected tasks with 3 test cases each (OpenAI reported 45.5%)
- id: spreadsheetbench-hard-restriction
  text: 32.5% accuracy on SpreadsheetBench hard-restriction tasks in the same test (GPT-4o
    reported 13.38%)
- id: prompt-crafting-before-architect
  text: 30-45 minutes of prompt crafting, file uploading, and error resolution per use before
    the Architect existed
lessons_learned:
- id: bottleneck-instruction-not-execution
  text: At Ramp the bottleneck was instruction, not execution; once the Architect wrote the
    prompts, adding workflows cost near-zero human time instead of scaling with prompt-writing
    capacity.
- id: complementary-model-strengths
  text: Ramp Labs used Gemini 2.5 Pro's long-context multimodal ability to extract workflows
    from video and Claude Sonnet 4.5 for swift, precise, economic execution.
- id: production-agents-still-hard
  text: Despite powerful models, the Ramp Labs team spent weeks iterating on system prompts,
    tool designs, and error handling; the engineering mattered as much as the models.
- id: async-intake-not-autonomy
  text: The post documents unattended prompt generation and asynchronous pickup, but not
    whether a person reviews the completed spreadsheets or ERP entries; the catalog records
    the review boundary as unknown.
