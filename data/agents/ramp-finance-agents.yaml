claim_metadata:
  operating_models.0:
    confidence: unverified
    confidence_reason: The post reports that the Architect generates prompts without human
      intervention and that accountants return to a ready-to-use process, and it names human
      intervention only after partial completions; it does not state whether a person reviews
      completed work in a normal run.
    valid_at: '2025-10'
  headline_metric:
    confidence: medium
    confidence_reason: Ramp Labs reports the comparison directly for its named spreadsheet
      tasks, but states no measurement method, sample, or time period.
    valid_at: '2025-10'
    category: effectiveness
    basis: reported-measurement
    subject: The named spreadsheet accounting tasks
    metric_scope: Spreadsheet accounting tasks that took 1-2 hours, such as monthly revenue
      reconciliation and month-end inter-company transfers
  key_metrics.spreadsheetbench-soft-restriction:
    confidence: medium
    confidence_reason: A self-run benchmark with a stated task count and comparison figures;
      the evaluation setup is reported only by Ramp Labs.
    valid_at: '2025-10'
    category: effectiveness
    basis: reported-measurement
    subject: Doer agent accuracy on SpreadsheetBench soft-restriction tasks
    metric_scope: About 50 randomly selected SpreadsheetBench tasks with 3 test cases each
  key_metrics.spreadsheetbench-hard-restriction:
    confidence: medium
    confidence_reason: A self-run benchmark with a stated task count and comparison figures;
      the evaluation setup is reported only by Ramp Labs.
    valid_at: '2025-10'
    category: effectiveness
    basis: reported-measurement
    subject: Doer agent accuracy on SpreadsheetBench hard-restriction tasks
    metric_scope: The same about 50 randomly selected SpreadsheetBench tasks with 3 test
      cases each
  key_metrics.prompt-crafting-before-architect:
    confidence: medium
    confidence_reason: The post states the setup time directly as the reported cost of each
      use before the Architect existed, with no measurement method.
    valid_at: '2025-10'
    category: cost-latency
    basis: reported-measurement
    subject: Manual setup time per finance-agent use before the Architect
    metric_scope: Prompt crafting, file uploading, and error resolution per use of the finance
      agent
  lessons_learned.bottleneck-instruction-not-execution:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The post states the bottleneck conclusion and the scaling contrast
      between manual prompt writing and Architect-generated workflows.
  lessons_learned.complementary-model-strengths:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The post names both models and the strength each contributed to its
      stage of the pipeline.
  lessons_learned.production-agents-still-hard:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The post reports the weeks of iteration on prompts, tools, and error
      handling directly.
  lessons_learned.async-intake-not-autonomy:
    confidence: medium
    confidence_reason: The inference follows from what the post leaves unstated; the unattended
      generation and the partial-completion interventions are reported, the review boundary
      for completed work is not.
