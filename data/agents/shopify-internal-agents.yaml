    metric_scope: Merged River-coauthored PRs across Shopify
    denominator: All Shopify merged pull requests
    category: adoption-output
    basis: reported-measurement
    subject: Company-wide merged pull requests coauthored by River
  key_metrics.river-sessions-days-slack-channels:
    metric_scope: River sessions and distinct Slack channels in a recent 30-day period
    measurement_method: river_sessions domain table, written by River every session
    category: adoption-output
    basis: reported-measurement
    subject: River sessions and distinct Slack channels over a recent 30-day period
  key_metrics.river-coauthored-prs-merged-company-wide:
    metric_scope: River-coauthored merged PRs in the recent 30-day period; company-wide PR share
    denominator: All Shopify merged pull requests for the one-in-eight share
    measurement_method: river_sessions domain table for reported session-linked counts
    category: adoption-output
    basis: reported-measurement
    subject: River-coauthored merged pull requests and their company-wide share in a recent 30-day period
  key_metrics.river-median-session-min-tool-calls:
    metric_scope: Median River session duration and tool calls per session
    category: cost-latency
    basis: reported-measurement
    subject: Median River session duration and median tool calls per session
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - shopify-internal-agents-source-1
  workflow_scope: 'One River thread: public @river request through worked findings, a human redirect, and a searchable
    transcript'
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.take-request-public-channel
      - primitives.work-the-problem-in-the-open
      - primitives.absorb-a-mid-thread-redirect
      - primitives.leave-a-reusable-transcript
      note: The article documents exactly one representative workflow, the well-going public River thread; PR review
        and the headless Vanilla profile are separate Aquifer profiles, not steps of this run.
    human_involvement:
      state: not-applicable
      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
    validation:
      state: unreported
      note: Tests River runs are part of its work, and CI improvements serve human developers; no check of River's
        own output is documented.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    model:
      note: The documented content is the swap design; no specific model is named.
    sandbox:
      note: The brain-and-hands framing the claim credits to Anthropic appears in the capture only as an unnamed
        linked essay.
    credentials:
      note: The credentials proxy and per-profile sandbox policy are documented; Shopify SSO is not named in the
        capture.
    interfaces:
      note: Slack is named; the capture documents pull-request creation but never names GitHub as the host.
