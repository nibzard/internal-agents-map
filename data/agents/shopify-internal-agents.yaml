# yaml-language-server: $schema=../agent.schema.json
id: shopify-internal-agents
company: Shopify
agent_name: Aquifer
approach_type: platform
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: shopify-internal-agents-source-1
last_reviewed_at: '2026-09-17'
status: internal
domains:
- coding
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: River coding request → River-opened, River-coauthored pull request
  attention_boundary: unknown
rubric:
  invocation:
  - event-driven
  - interactive
  evidence_strength: detailed-primary
summary: The Aquifer agent platform (session/harness/sandbox split) powers River, a Slack-native coding agent, plus
  PR-review and headless Vanilla agent profiles; other teams have requested research, migration, and compliance-scan
  agents.
headline_metric: 'River use example: 1 in 8 merged PRs company-wide coauthored by River'
architecture:
  sandbox: An execution environment (filesystem, shell, repo, build/test) separated from the harness; Shopify credits
    the brain-and-hands framing to Anthropic
  harness: Session (durable; Postgres append-only event log) + Harness (cheap agent loop) + Cell (ephemeral Go runtime);
    cells die, sessions persist
  model: The design lets Shopify change the model without changing the sandbox
  interfaces:
  - slack
  tool_access: Repo + tests + data warehouse + production traces + PR creation; a gateway credentials proxy
  knowledge: Monorepo 'World' (code + skills + conventions + intent docs + runbooks + AGENTS.md); Nix reproducible
    envs; Slack-transcript corpus mining
  credentials: Gateway credentials proxy and per-profile sandbox policies; the source does not name an SSO mechanism.
  context_mgmt: Skills loaded on-demand as files, updatable per session; session survival across cell/sandbox/machine
    death
primitives:
- id: session-harness-sandbox-split
  name: Session/Harness/Sandbox split
  desc: Durable identity, disposable loop, isolated execution; swap any layer independently
  role: mechanism
- id: river-public-by-default
  name: River (public-by-default)
  desc: River works in shared Slack threads whose history can be searched and used to update skills
  role: mechanism
- id: skills-as-files
  name: Skills as files
  desc: Written-down knowledge mined from successful patterns and public transcripts
  role: mechanism
- id: take-request-public-channel
  name: Take a request in a public channel
  desc: A person @-mentions River with a question or task in a public Slack channel; River works only in the open
  role: workflow
- id: work-the-problem-in-the-open
  name: Work the problem in the open
  desc: River reads files, runs queries and tests, and posts partial findings to the thread
  role: workflow
- id: absorb-a-mid-thread-redirect
  name: Absorb a mid-thread redirect
  desc: A second person drops in with a constraint or redirect; River incorporates it without losing the conversation
    and continues
  role: workflow
- id: leave-a-reusable-transcript
  name: Leave a reusable transcript
  desc: The finished thread stays searchable so the next person starts from it, and observed patterns feed back
    into skills
  role: workflow
key_metrics:
- id: river-sessions-days-slack-channels
  text: 'River: 59,918 sessions / 30 days across 5,170 Slack channels'
- id: river-coauthored-prs-merged-company-wide
  text: 3,536 River-coauthored PRs merged; 1 in 8 merged PRs company-wide
- id: river-median-session-min-tool-calls
  text: 'River: Median session 19 min; median 50 tool calls/session'
lessons_learned:
- id: monorepo-reproducible-environments-written-skills-ci
  text: Shopify says its monorepo, reproducible environments, written skills, and CI improvements benefited both engineers
    and agents.
- id: uses-shared-river-threads-run-corpus
  text: Shopify uses shared River threads and the run corpus to update skills, prompts, and defaults for later work.
- id: stores-session-identity-event-log-postgres
  text: Aquifer stores session identity and its event log in Postgres so a fresh worker can continue the same conversation.
- id: adds-agent-variants-profiles-containing-prompts
  text: Shopify adds agent variants as profiles containing prompts, skills, extensions, sandbox policy, and model defaults
    on Aquifer.
