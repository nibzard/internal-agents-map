claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: "The post states that on a four-day migration the humans involved did exactly one thing,
      review, and that merging now happens only on an explicit human instruction after the agent once merged on
      seeing an approval. Review is of the pull request itself, which places the boundary at the work product rather
      than at the outcome."
    valid_at: "2026-07"
  key_metrics.design-system-migration-touching-around-usages:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "Bitrise reports the file and usage counts for one migration in its own engineering blog
      without a measurement method; it describes the scale of one task, not a measured result."
    reported_by: Bitrise
    metric_scope: "One design-system migration Kolega handled during a recent week"
    category: implementation-scale
    basis: qualitative
    subject: "One design-system migration Kolega handled, in usages, files, days, merge-conflict rounds, and
      review comments"
  key_metrics.orchestrator-single-small-python-service-mostly:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "Bitrise states the service size, its authorship, and an approximate build time in its own
      engineering blog; no line count, commit history, or dated milestone supports the few-weeks figure."
    reported_by: Bitrise
    metric_scope: "Building the Kolega orchestrator service"
    category: implementation-scale
    basis: qualitative
    subject: "Size, authorship, and elapsed build time of the Kolega orchestrator service"
  lessons_learned.puts-guardrails-code-rather-system-prompt:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: "The post states the rule and names the enforced case: the orchestrator's shell, file, and
      GitHub source-read tools are denied in code rather than in the prompt."
  lessons_learned.keeps-humans-two-decisions-merging-anything:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: "The two retained decisions are stated explicitly, and the merge gate and the Approve /
      Reject button on public writes are described as the mechanisms that hold them."
  lessons_learned.guardrail-followed-incident-agent-once-merged:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: "The post names the specific incident and the specific rule change it produced; it does not
      say how often the incident occurred or what other guardrails each incident produced."
  lessons_learned.handles-stop-command-outside-normal-message:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "Both behaviors are described as implemented rules with their triggers named; the post gives
      no example of either firing, so the effect on real runs is not documented."
  lessons_learned.prefers-delegate-thinking-rather-only-typing:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: "This is the team's stated design preference for its own orchestrator, supported by the
      reported fact that the orchestrator does not read source code; the post offers no comparison against an
      orchestrator that plans from source, so the preference is not shown to generalize."

