id: bitrise-kolega
company: Bitrise
agent_name: Kolega
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: "2026-07-15"
  source_id: bitrise-kolega-source-1
last_reviewed_at: "2026-09-21"
status: internal
domains:
- coding
- code-review
- ci-triage
- maintenance
autonomy: drafts-reviewed
operating_models:
- scope: "Jira ticket assignment or Slack mention → merged pull request"
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  - event-driven
  evidence_strength: detailed-primary
summary: "Bitrise runs Kolega, an internal coding agent that lives in Slack. A Jira ticket assigned to its Jira
  user or an @mention in a thread starts a session; the agent reads the requirements, posts a plan, and delegates
  the coding to a disposable Remote Dev Environment. It opens a pull request, watches CI, and reacts to review
  comments, CI results, and Jira events as they arrive, then cleans up the machine and closes the ticket after the
  merge. The orchestrator itself cannot run or read code. Bitrise published bitclaw, an MIT-licensed reference
  implementation of the same architecture."

architecture:
  sandbox: "A disposable Remote Dev Environment per task, created from a single pinned template whose warmup script
    installs Claude Code, sets up a git-only SSH identity, and starts the agent in a tmux session; every task gets
    its own machine, and the machine is deleted when the work is done"
  harness: "A single small Python service orchestrating from Slack. One Slack thread is one session; the
    orchestrator creates and drives Remote Dev Environment sessions through the RDE MCP server, typing instructions
    into the coding agent's tmux pane and reading the pane back"
  model: "Claude. The orchestrator holds one persistent Claude conversation per Slack thread, and the dev-environment
    template installs Claude Code for the coding agent; no model version is named"
  interfaces:
  - slack
  - jira
  - github
  - ci
  tool_access: "Narrowly scoped orchestrator tools: post to Slack, read and manage pull requests, read Jira, query
    Datadog for logs, metrics, and error tracking, and create and drive Remote Dev Environments. The orchestrator
    has no shell and no file access and cannot read source code through the GitHub API; those tools are denied in
    code rather than in the prompt. The coding agent inside the dev environment holds a push-scoped SSH key and no
    GitHub API access, so git is its only interface to the outside world"
  credentials: "Credentials reach the coding machine through encrypted saved inputs and session inputs and are never
    baked into an image. The coding agent receives a push-scoped SSH key and no GitHub API access, and the
    orchestrator's own credentials never touch the machine"
  context_mgmt: "One Slack thread is one session backed by one persistent Claude conversation, so context survives
    messages, webhooks, and days-later follow-ups. Pull requests and tickets are anchored to the thread that owns
    them, so review comments, CI results, and Jira transitions arrive in the right conversation. The thread receives
    milestones only, not the agent's running commentary"

primitives:
- id: ticket-merge-loop-one-slack-thread
  name: "Ticket-to-merge loop in one Slack thread"
  desc: "Jira assignment or Slack mention → plan → delegated coding in a disposable dev environment → pull request →
    reactions to review and CI events → human-instructed merge, cleanup, and ticket closure"
  role: mechanism
- id: pick-work-post-plan
  name: "Pick up the work and post a plan"
  desc: "Assigning a Jira ticket to Kolega's Jira user, or an @mention in a thread, starts a session; the agent posts
    a card within a second, reads the requirements, posts a plan, and then reports milestones only"
  role: workflow
- id: delegate-coding-disposable-dev-environment
  name: "Delegate the coding to a disposable dev environment"
  desc: "The orchestrator creates a Remote Dev Environment from a pinned template with a self-contained task brief
    naming the repository, the ticket, the acceptance criteria, and the branch rules"
  role: workflow
- id: write-test-code-push-branch-open
  name: "Write and test the code, push a branch, and open a pull request"
  desc: "The coding agent in the dev environment makes the change, runs the tests locally, pushes the branch over
    git, and the pull request is opened and reported back to the thread"
  role: workflow
- id: react-anchored-events-without-human-relay
  name: "React to anchored events without a human relay"
  desc: "Review comments, CI results, Jira comments, and the merge itself arrive in the owning thread as they
    happen; the agent fixes what a reviewer asked for, answers questions on the ticket, and reacts to events rather
    than polling"
  role: workflow
- id: merge-explicit-human-instruction-clean
  name: "Merge on an explicit human instruction, then clean up"
  desc: "Merging happens only on an explicit human instruction; after the merge the agent tears down the dev
    machine, transitions the ticket, and signs off in the thread"
  role: workflow
- id: orchestrator-that-cannot-code
  name: "An orchestrator that cannot code"
  desc: "The orchestrator has no shell and no file access and cannot even read source code through the GitHub API;
    the tools are denied in code, not in the prompt, so it plans, relays, narrates, and asks"
  role: mechanism
- id: isolation-as-the-security-model
  name: "Isolation as the security model"
  desc: "The coding agent's push-scoped SSH key and lack of GitHub API access mean that a prompt injection hidden in
    a codebase reaches no further than a pushed branch that still has to survive human review"
  role: mechanism
- id: never-block-on-input
  name: "Never block on input"
  desc: "The task brief instructs the coding agent to pick the most defensible default, document the assumption in
    the commit message and pull request description, and continue, because the pull request review is where wrong
    assumptions get corrected"
  role: mechanism
- id: test-environment-matches-ci
  name: "Test in an environment that matches CI"
  desc: "Dev-environment sessions run on the same infrastructure and stacks as Bitrise CI, so passing tests in the
    session and in CI stop being different claims; when CI fails the orchestrator relays the failing check into the
    session and the coding agent reproduces it"
  role: validation
- id: gate-public-writes-and-fail-closed
  name: "Gate public writes and fail closed"
  desc: "Untrusted authors' text is redacted before the model sees it, every public write waits behind an Approve /
    Reject button in Slack, and the agent holds when it cannot confirm that an author is trusted, a repository is
    private, or a check succeeded"
  role: validation

key_metrics:
- id: design-system-migration-touching-around-usages
  text: "Bitrise describes a design-system migration touching around 200 usages across 167 files that Kolega planned,
    delegated, and then shepherded for four days through three rounds of merge conflicts and nine automated review
    comments, with the humans involved only reviewing"
- id: orchestrator-single-small-python-service-mostly
  text: "Bitrise describes the orchestrator as a single small Python service that was mostly written by a coding agent and
    went from first commit to handling real tickets in a few weeks"

lessons_learned:
- id: puts-guardrails-code-rather-system-prompt
  text: "Bitrise puts its guardrails in code rather than in the system prompt: which tools exist, whose text the agent may
    read, and what needs approval are hard checks rather than prompt instructions."
- id: keeps-humans-two-decisions-merging-anything
  text: "Bitrise keeps humans on two decisions, merging and anything the outside world can see, and lets planning, coding,
    testing, and replying to reviewers run without a human in the middle."
- id: guardrail-followed-incident-agent-once-merged
  text: "Each Bitrise guardrail followed an incident: the agent once merged its own pull request the moment it saw an
    approval, so merging now happens only on an explicit human instruction."
- id: handles-stop-command-outside-normal-message
  text: "Bitrise handles a stop command outside the normal message queue so that it interrupts a running turn, and holds
    when the agent cannot confirm that an author is trusted, a repository is private, or a check succeeded."
- id: prefers-delegate-thinking-rather-only-typing
  text: "The Bitrise team prefers to delegate the thinking rather than only the typing: its orchestrator does not read
    source code even to plan, on the view that the coding agent in front of the full working tree should plan its own
    work."

