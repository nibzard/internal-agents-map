claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source explicitly describes humans steering and reviewing the agent throughout its work.
    valid_at: '2026'
  operating_models.1:
    confidence: unverified
    confidence_reason: Webhook and scheduler inputs become synthetic messages the agent decides on alone; no passage
      documents a person reviewing the agent-initiated thread updates.
    valid_at: '2026'
  lessons_learned.author-prefers-one-agent-work-company:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The author describes a personal workflow preference and also acknowledges the value of
      vendor specialization; the article contains no head-to-head outcome comparison.
  lessons_learned.skills-contain-operational-instructions-including-telemetry:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Sentry skill lists concrete query and authentication steps, and release-package is
      given as an example of a reusable playbook.
  lessons_learned.pauses-serverless-timeout-queues-continuation-task:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The runtime section names the soft deadline, a completed tool result as the intended pause
      point, and the queued continuation.
  lessons_learned.tests-agent-behavior-event-scenarios-explicit:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The vitest-evals example checks continuation after authorization and retained conversation
      context. The concrete practice does not require adopting the author's broader dismissal of unit tests.
  lessons_learned.combines-installation-token-reads-per-user:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The authorization discussion distinguishes global read access from user-authorized writes;
      it is an integration design, not a guarantee for every tool.
  headline_metric:
    metric_scope: Junior codebase size (excluding tests, evals, documentation, and lockfiles) and license in the author report
    category: implementation-scale
    basis: reported-measurement
    subject: 'Junior codebase size,
      Apache-2.0 license, and internal use at Sentry'
  key_metrics.lines-typescript-excluding-tests-evals-docs:
    metric_scope: TypeScript lines in Junior excluding tests, evals, documentation, and lockfiles
  key_metrics.time-from-start-to-writeup:
    metric_scope: Author-reported development and iteration time before the writeup
    category: implementation-scale
    basis: reported-measurement
    subject: 'Author-reported development
      time from project start to writeup'
