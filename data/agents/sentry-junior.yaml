# yaml-language-server: $schema=../agent.schema.json
id: sentry-junior
company: Sentry
agent_name: Junior
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026'
  source_id: sentry-junior-source-2
last_reviewed_at: '2026-09-16'
status: open-sourced
domains:
- coding
- code-review
- support
- on-call
autonomy: human-in-loop
operating_models:
- scope: interactive Slack task → human-steered and reviewed output
  attention_boundary: continuous-steering
- scope: event- or scheduler-triggered follow-up (watched GitHub PR) → agent-initiated thread update
  attention_boundary: unknown
rubric:
  invocation:
  - event-driven
  - interactive
  - scheduled
  evidence_strength: detailed-primary
summary: An open-source Slack agent built at Sentry that retrieves context and acts across company systems.
  People can steer interactive tasks in a thread; Junior also handles scheduled tasks and inbound events. Its
  author prefers one agent for work that spans several systems.
headline_metric: Open-source (Apache-2.0) Slack agent (~100k lines of TypeScript excluding tests, evals, docs,
  and lockfiles) used internally at Sentry
architecture:
  sandbox: Vercel serverless functions; Vercel agent-browser sandbox with an on-path proxy for traffic interception;
    ephemeral containers
  harness: Custom harness on Pi's SDK; a task broker over Vercel Queues with an inbox → worker-claim → interrupt/resume
    pattern to survive serverless timeouts; 'skills-as-runbooks'
  model: Claude Sonnet (faster); swappable (Opus as a more expensive option)
  interfaces:
  - slack
  - web
  - github
  tool_access: Progressive discovery via MCP; by default Junior connects to no provider until the agent requests
    a tool lookup; plugins connect Sentry, GitHub, Linear, Notion
  knowledge: Conversation transcripts persisted in Redis; repo search to trace code paths; skill docs (TELEMETRY.md,
    SOUL.md)
  credentials: On-path proxy injection; the model never sees the token because it is not in the sandbox; plugins
    declare OAuth flows and credential domains; GitHub distinguishes read vs. write
  context_mgmt: Incremental transcript updates in Redis; resource subscriptions to GitHub PR events for follow-ups
primitives:
- id: progressive-tool-discovery
  name: Progressive tool discovery
  desc: searchMcpTools connects to a requested MCP provider and discovers its tools on demand
  role: mechanism
- id: path-credential-proxy
  name: On-path credential proxy
  desc: An outbound proxy injects credentials for configured domains or pauses the agent for authorization
  role: mechanism
- id: interrupt-resume-broker
  name: Interrupt/resume broker
  desc: Pauses near a serverless deadline and queues a task to continue the session
  role: mechanism
- {id: answer-slack-question-codebase, name: Answer a Slack question from the codebase, desc: 'Junior searches the repo, traces the code path, and answers
    in the thread instead of guessing', role: workflow}
- {id: open-github-issue-conversation, name: Open a GitHub issue from a conversation, desc: 'Tagged in a thread, Junior summarizes the discussion, does
    gap analysis or an RCA, and opens the ticket through the typed tool that attaches the deterministic footer', role: workflow}
- {id: run-visual-qa-browser-sandbox, name: Run visual QA in the browser sandbox, desc: 'Junior opens a feature with agent-browser, clicks around, takes
    screenshots or videos, and writes up the rough edges in the same thread', role: workflow}
- {id: watch-pull-request-follow-ups, name: Watch a pull request for follow-ups, desc: 'After opening a PR Junior subscribes to its events; a failed
    check or requested change becomes a synthetic message, and Junior decides what to update in the thread', role: workflow}
key_metrics:
- id: lines-typescript-excluding-tests-evals-docs
  text: Around 100,000 lines of TypeScript excluding tests, evals, docs, and lockfiles
- id: time-from-start-to-writeup
  text: 4 months from start to writeup
lessons_learned:
- id: author-prefers-one-agent-work-company
  text: Junior's author prefers one agent that can work across company systems to choosing among several vendor-specific
    bots.
- id: skills-contain-operational-instructions-including-telemetry
  text: Junior's skills contain operational instructions, including telemetry lookup conventions and the GitHub workflows
    used for package releases.
- id: pauses-serverless-timeout-queues-continuation-task
  text: Junior pauses before a serverless timeout and queues a continuation task at a resumable point.
- id: tests-agent-behavior-event-scenarios-explicit
  text: Junior tests agent behavior with event scenarios, explicit evaluation criteria, and assertions on side effects.
- id: combines-installation-token-reads-per-user
  text: Junior combines an installation token for reads with per-user OAuth for writes in its GitHub integration.
