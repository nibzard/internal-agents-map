id: deel-payroll-incident-agents
company: Deel
agent_name: Four-stage payroll sync triage pipeline
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026-08-31'
  source_id: deel-payroll-incident-agents-source-1
last_reviewed_at: '2026-09-21'
status: internal
domains:
- finance-ops
- ops
autonomy: drafts-reviewed
operating_models:
- scope: failed US PEO payroll sync → automatic retry that clears the failure
  attention_boundary: exception-only
- scope: payroll sync failure that survives the retry → classified diagnosis and fix command delivered in Slack
    for an engineer
  attention_boundary: work-product-review
rubric:
  invocation:
  - scheduled
  evidence_strength: limited-primary
summary: Deel runs a four-stage pipeline that triages failed US PEO payroll syncs without an engineer starting it.
  The pipeline detects and batches failures, retries them, investigates the rest with parallel data fetches, classifies
  the cause and writes the fix command, then posts a per-failure summary to Slack. Deel deployed it on Akai, which
  the post calls the company's internal AI orchestration platform.
headline_metric: Deel reports 900+ engineering hours reclaimed annually
architecture:
  harness: Four stages run in sequence on Akai, described as Deel's internal AI orchestration platform. Each stage
    owns one job and hands off to the next with no manual intervention and no engineer to start the run.
  interfaces:
  - slack
  tool_access: Scans the payroll system for failed syncs and fires retries against them. For failures that survive
    a retry it checks hire record state, pulls logs from monitoring systems, queries the payroll database, and
    cross-references employment compliance rules. It writes the fix command rather than running it, and posts the
    result to Slack with direct log links.
  knowledge: The classification stage holds a structured taxonomy of failure types, such as duplicate SSN, invalid
    address, missing tax filing status, and bad routing data. Deel adds a new category with a one-line prompt change.
  context_mgmt: Each stage takes JSON, does its work, and outputs JSON, so the stages share no state between them.
primitives:
- id: detect-and-batch-the-failures
  name: Detect and batch the failures
  desc: Every few minutes the first stage scans the payroll system for failed syncs, deduplicates them, groups related
    failures, and hands a clean batch downstream without a Slack ping or a human trigger.
  role: workflow
- id: retry-first-then-investigate-in-parallel
  name: Retry first, then investigate in parallel
  desc: The second stage fires an automatic retry on every failure. About 55% clear themselves. For the rest it
    fans out in parallel to check hire record state, pull monitoring logs, query the payroll database, and
    cross-reference compliance rules, so diagnosis lands in under 10 seconds across four systems.
  role: workflow
- id: classify-failure-write-fix
  name: Classify the failure and write the fix
  desc: The third stage categorizes the failure against a taxonomy, decides whether it belongs to the employer,
    the employee, or Deel, and writes out the exact command needed to fix it.
  role: workflow
- id: deliver-one-slack-section-per-failure
  name: Deliver one Slack section per failure
  desc: The fourth stage packages the results into Slack with one section per failure, copy-paste fix commands, and
    direct log links. It also scans across cases and reports a repeated error from one company as a single
    employer-level setup issue instead of one alert per new hire.
  role: workflow
key_metrics:
- id: triage-time-per-failure
  text: Time per triage fell from 45 minutes to under 10 seconds
- id: auto-resolved-cases
  text: Auto-resolved cases rose from 0% to 55%; about 55% of cases now self-resolve without anyone touching them
- id: peak-capacity-rose-full-engineering-day
  text: Peak capacity rose from a full engineering day for 4-6 cases to 20+ cases at the same time
lessons_learned:
- id: runs-stages-sequence-fires-investigation-stage
  text: Deel runs its stages in sequence but fires the investigation stage's data fetches at the same time, and reports
    that this parallel fan-out is the difference between a 40-second and a 10-second operation.
- id: keeps-failure-taxonomy-classification-stage-prompt
  text: Deel keeps the failure taxonomy in the classification stage's prompt, so a new failure category found in production
    is a one-line prompt change.
- id: passes-clean-json-between-stages-share
  text: Deel passes clean JSON between stages so that the stages share no state and carry no interdependencies.
- id: retries-payroll-sync-failure-immediately-measures
  text: Deel retries every payroll sync failure immediately, measures what share clears itself, and investigates only
    the remainder; the team notes a retry on a payroll record is only safe once the diagnosis runs anyway.
- id: pattern-not-specific-to-payroll
  text: Deel states that the pattern is not specific to its payroll system and maps onto other high-volume, low-signal
    triage work such as API failures, database incidents, and support escalations. The post reports no second Deel
    workflow that uses it.
