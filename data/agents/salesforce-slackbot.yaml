claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: 'The source describes an employee agent that prepares drafts and contextual work for human use.'
    valid_at: '2026-01-14'
  lessons_learned.used-slackbot-internally-phased-customer-rollout:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The launch post includes an internal-use account alongside the rollout dates; it does
      not demonstrate that internal-first release is best for other products.
  lessons_learned.uses-slack-roles-access-permissions-limit:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The product announcement makes this permission claim but does not expose the enforcement
      implementation or independently test its effectiveness.
  key_metrics.employees-who-tried-slackbot:
    confidence: medium
    confidence_reason: Salesforce internal adoption figures relayed by VentureBeat without a measurement method
      or window.
    valid_at: '2026-01'
    metric_scope: Salesforce employees during the internal rollout; continuation measured among those who tried it
    category: adoption-output
    basis: reported-measurement
    subject: 'Salesforce employees trying
      the new Slackbot during the internal rollout and continuing to use it'
  key_metrics.internal-satisfaction-reached-employees-report-saving:
    confidence: medium
    confidence_reason: Salesforce internal satisfaction and self-reported time savings relayed by VentureBeat;
      no survey method or baseline is given.
    valid_at: '2026-01'
    metric_scope: Internal satisfaction rating and employee-reported weekly hours saved during the internal rollout
    category: effectiveness
    basis: reported-measurement
    subject: 'Internal satisfaction rating
      and self-reported weekly hours saved'
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [salesforce-slackbot-source-1, salesforce-slackbot-source-2, salesforce-slackbot-source-3,
    salesforce-slackbot-source-4]
  workflow_scope: Employee request to a drafted briefing or shared Canvas in Slack
  questions:
    purpose: {state: reported}
    workflow: {state: reported, claim_paths: [primitives.prepare-a-customer-meeting-briefing, primitives.turn-scattered-analysis-shared-canvas], note: 'The briefing run is from the
      launch post; the Canvas run is the documented product demonstration. Both are employee-initiated.'}
    human_involvement: {state: reported, claim_paths: [operating_models.0], note: 'Drafts are refined through
      conversation with the requesting employee; no approval gate beyond that user is documented.'}
    implementation: {state: reported}
    validation: {state: unreported, note: 'The staged interview self-describes citing sources and
      admitting unknowns; no systematic check of outputs is documented.'}
    observations: {state: reported}
    lessons: {state: reported}
  implementation_fields:
    sandbox: {state: unreported, note: 'The interview describes an LLM with a robust search layer;
      no execution or isolation boundary is documented.'}
    tool_access: {note: 'Meeting booking was announced
      as arriving a few weeks after general availability; calendar availability checking shipped at launch.'}
    context_mgmt: {state: unreported, note: 'Grounding in Slack context and conversation continuity
      are described; how context is maintained or organized over time is not.'}
    credentials: {note: 'The documented mechanism is
      data-access authorization bounded by the employee''s permissions; credential storage is not described.'}
