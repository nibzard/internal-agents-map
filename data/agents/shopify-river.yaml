claim_metadata:
  operating_models.0:
    confidence: unverified
    confidence_reason: The source describes a colleague optionally redirecting a public thread, but does not require
      continuous steering or a universal PR approval checkpoint.
    valid_at: '2026'
  operating_models.1:
    confidence: medium
    confidence_reason: The CEO says employees reviewed River-authored pull requests. This supports review of that
      work product, but does not define oversight for other River tasks.
    valid_at: '2026-05-09'
  key_metrics.sessions-across-slack-channels:
    metric_scope: 'River: 59,918 sessions across 5,170 Slack channels in a reported 30-day period; 3,536 River-coauthored
      PRs merged.'
    confidence: medium
    confidence_reason: Self-reported by the source; no independent verification.
    measurement_method: river_sessions domain table written by River each session
    category: adoption-output
    basis: reported-measurement
    subject: 'River: 59,918 sessions across 5,170 Slack channels in a reported 30-day period; 3,536 River-coauthored
      PRs merged.'
  key_metrics.may-employees-and-channels:
    confidence: medium
    confidence_reason: The CEO reports exact counts without a measurement method.
    valid_at: '2026-05-09'
    metric_scope: Employees who worked with River and distinct Slack channels with River activity
    measurement_method: Company usage data summarized by the CEO; 30 days ending 2026-05-09
    category: adoption-output
    basis: reported-measurement
    subject: River employees and Slack channels in a 30-day period ending 2026-05-09.
  key_metrics.may-weekly-pull-requests:
    confidence: medium
    confidence_reason: The CEO reports the weekly count without a measurement method.
    valid_at: '2026-05-09'
    metric_scope: Pull requests opened by River in the main monorepo in one week
    measurement_method: Company usage data summarized by the CEO; week ending 2026-05-09
    category: adoption-output
    basis: reported-measurement
    subject: River pull requests opened in the main monorepo in the week ending 2026-05-09.
  key_metrics.pull-request-merge-rate:
    confidence: medium
    confidence_reason: The CEO reports the change without defining the merge rate or its measurement method.
    valid_at: '2026-05-09'
    metric_scope: Merge rate of River pull requests over two months
    category: adoption-output
    basis: reported-measurement
    subject: River pull request merge rate over two months, as reported by Shopify's CEO.
  lessons_learned.public-threads-share-skills:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The CEO describes employees learning from public River threads and sharing skills across teams.
  lessons_learned.skills-improve-merge-rate:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The CEO attributes the reported increase in merge rate to employees updating River's skills.
relationships:
- type: built-on
