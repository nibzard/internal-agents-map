# yaml-language-server: $schema=../agent.schema.json
id: shopify-river
company: Shopify
agent_name: River
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2026-05-09'
  source_id: shopify-river-source-3
last_reviewed_at: '2026-09-28'
status: internal
domains:
- coding
autonomy: unknown
operating_models:
- scope: public Slack question → collaborative investigation or code change
  attention_boundary: unknown
- scope: River-authored code change → reviewed pull request
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  evidence_strength: detailed-primary
summary: River is Shopify’s internal Slack agent for investigating questions and making code changes in public
  threads. Teams can provide channel context, and River carries knowledge across conversations.
architecture:
  harness: An agent profile on Aquifer.
  tool_access: Code, tests, data warehouse and production traces.
  knowledge: World monorepo, skills and shared Slack transcripts.
  context_mgmt: Teams can pre-load channel instructions and skills. River also uses memory that updates across
    conversations.
  interfaces:
  - slack
primitives:
- id: receive-a-request
  name: Receive a request
  desc: An employee mentions River in a public Slack channel.
  role: workflow
- id: investigate-and-act
  name: Investigate and act
  desc: River reads files, runs tests and queries, and posts findings; it can open pull requests.
  role: workflow
- id: continue-collaboratively
  name: Continue collaboratively
  desc: Colleagues add constraints and redirect the work within the same thread.
  role: workflow
- id: work-in-public
  name: Work in public
  desc: River declines direct messages and asks employees to start a public channel.
  role: mechanism
- id: carry-knowledge-forward
  name: Carry knowledge forward
  desc: Teams pre-load channel context, and River updates its memory from shared work.
  role: mechanism
