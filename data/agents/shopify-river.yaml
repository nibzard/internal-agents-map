key_metrics:
- id: sessions-across-slack-channels
  text: 59,918 sessions across 5,170 Slack channels in a reported 30-day period; 3,536 River-coauthored PRs merged.
- id: may-employees-and-channels
  text: 5,938 employees worked with River across 4,450 Slack channels in the 30 days before 2026-05-09.
- id: may-weekly-pull-requests
  text: 1,870 pull requests opened by River in the main monorepo in the week before 2026-05-09.
- id: pull-request-merge-rate
  text: River pull request merge rate rose from 36% to 77% over two months, according to Shopify's CEO.
lessons_learned:
- id: public-threads-share-skills
  text: Shared River threads let Shopify employees learn from other teams' requests and reuse their skills.
- id: skills-improve-merge-rate
  text: Shopify's CEO attributes River's rising pull request merge rate to public observation and written skills.
