# yaml-language-server: $schema=../agent.schema.json
id: slack-context-system
company: Slack
agent_name: Security investigation service
approach_type: agent
deployment_stage: deployed
first_public_evidence:
  date: '2025-12-01'
  source_id: slack-security-foundation
last_reviewed_at: '2026-09-17'
status: internal
domains:
- security
autonomy: drafts-reviewed
operating_models:
- scope: security alert → investigation report for on-call staff; owning team resolves escalated issues
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  - interactive
  evidence_strength: detailed-primary
summary: Slack's engineering team runs an agentic service that investigates security alerts. A Director agent orchestrates
  rounds, Expert agents gather evidence, and a Critic scores each finding for credibility. Instead of message history,
  three written channels carry the state between rounds.
headline_metric: Context management for security investigations spanning hundreds of inference requests and megabytes
  of output
architecture:
  harness: 'Coordinator/dispatcher: a central coordinator dispatches to expert agents and to critic agents'
  tool_access: Expert agents produce reports; critic agents evaluate them using evidence-inspection tools
  context_mgmt: Three channels; Director's Journal (working memory), Critic's Review (credibility-weighted findings),
    Critic's Timeline (deduped chronological synthesis)
primitives:
- id: director-journal
  name: Director's Journal
  desc: 'Structured working memory: findings, decisions, questions, hypotheses'
  role: mechanism
- id: critic-review
  name: Critic's Review
  desc: A model critiques submitted findings, inspects cited evidence, and assigns credibility scores
  role: validation
- id: critic-timeline
  name: Critic's Timeline
  desc: A model consolidates a timeline, removes duplicate events, and weighs conflicting findings between rounds
  role: mechanism
- id: pose-the-round-questions
  name: Pose the round's questions
  desc: The Director decides what questions to ask and which Experts to engage; investigations run in rounds until
    the Director concludes them
  role: workflow
- id: gather-evidence-and-submit-findings
  name: Gather evidence and submit findings
  desc: Experts interrogate their data sources and produce findings that cite investigation artifacts
  role: workflow
- id: conclude-the-investigation
  name: Conclude the investigation
  desc: The Director summarizes the root cause and the recommended actions, and ends the investigation
  role: workflow
key_metrics:
- id: handles-multi-agent-runs-spanning-hundreds
  text: Handles multi-agent runs spanning hundreds of requests and megabytes of output
- id: critic-scored-findings
  text: Over 170,000 findings scored by the Critic; slightly over a quarter fell below the plausible threshold
lessons_learned:
- id: passes-director-journal-reviewed-findings-consolidated
  text: Slack passes a director journal, reviewed findings, and a consolidated timeline between investigation rounds instead
    of forwarding the full message history.
- id: experts-gather-evidence-critic-checks-findings
  text: Slack's Experts gather evidence; a Critic checks their findings and can inspect the original tool calls and results.
- id: channels-preserve-information-investigation-rounds
  text: Slack's context channels preserve information across investigation rounds, but the report does not establish recovery
    after a worker restart.
