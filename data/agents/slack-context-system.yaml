  - slack-context-system-source-2
  - slack-security-foundation
  workflow_scope: Director-led investigation rounds from a security alert to a concluded report
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.pose-the-round-questions
      - primitives.gather-evidence-and-submit-findings
      - primitives.conclude-the-investigation
    human_involvement:
      state: reported
      claim_paths:
      - operating_models.0
      note: People supervise investigations and resolve escalated issues; the service investigates and reports.
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.critic-review
      note: The Critic Review scores each finding for credibility against the cited evidence; the Timeline additionally
        prunes findings that break narrative coherence.
    observations:
      state: reported
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: 'No model is named; the capture states only that a stronger model runs the Critic (source-1, line
        174).'
    knowledge:
      state: unreported
      note: No separate knowledge store is documented; evidence lives in investigation artifacts and the channels
        cited under context management.
    interfaces:
      state: unreported
      note: No human-facing surface is named; the service reacts to security alerts.
  aliases:
