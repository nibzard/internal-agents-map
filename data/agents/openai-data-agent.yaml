summary: OpenAI's internal-only data agent. Employees ask questions in natural language and the agent
  runs the analysis end to end over the company data platform, from finding tables and writing SQL to
  synthesizing findings, notebooks, and reports.
headline_metric: Question to insight in minutes rather than days (self-reported, January 2026)
architecture:
  harness: Custom conversational agent that evaluates its own progress and retries failed intermediate
    results; workflows package recurring analyses into reusable instruction sets
  model: GPT-5 with Codex for table-level knowledge and codebase crawling; Evals API for grading;
    Embeddings API for context embeddings
  tool_access: Live queries to the data warehouse plus the metadata service, Airflow, and Spark; web
    search; Slack, Google Docs, and Notion through a permission-aware retrieval service
  knowledge: Layered context that grounds the agent in schema metadata and table lineage, historical
    queries, curated table descriptions, Codex-derived code-level table definitions, embedded company
    documents, and runtime warehouse inspection
  credentials: Strictly pass-through access; users can only query tables they already have permission
    to access, and missing access is flagged or falls back to authorized datasets
  context_mgmt: A daily offline pipeline aggregates table usage, human annotations, and Codex
    enrichment into embeddings for retrieval at query time; global and personal memories save
    corrections for later runs
primitives:
- name: Memory
  desc: Global and personal memories retain non-obvious corrections, filters, and constraints; users
    can create and edit them
- name: Workflows
  desc: Recurring analyses packaged as reusable instruction sets, such as weekly business reports and
    table validations
- name: Golden-SQL evals
  desc: Curated question and answer pairs with authored golden SQL; generated and expected SQL and
    results are compared through the Evals grader
- name: Code-derived table context
  desc: Codex crawls pipeline code to derive what each table contains, beyond schemas and query
    history
key_metrics:
- OpenAI's data platform serves more than 3,500 internal users across Engineering, Product, and Research
- The data platform spans more than 600 petabytes across 70,000 datasets
lessons_learned:
- Exposing the full tool set confused the agent, so OpenAI restricted and consolidated overlapping
  tool calls
- Highly prescriptive prompting degraded results; higher-level guidance with model reasoning worked
  better
- A table's meaning lives in the pipeline code that produces it, not only in schemas and query history
