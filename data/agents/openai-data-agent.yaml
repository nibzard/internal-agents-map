summary: OpenAI's internal-only data agent, built by its data platform team. An employee asks an
  open-ended data question in natural language. The agent finds the right tables through a
  six-layer context stack, writes and runs SQL, checks its own intermediate results, and returns
  an answer with its reasoning and links to the underlying results. It saves corrections as
  global and personal memories. OpenAI states that the agent is a custom internal tool, not an
  external offering, and that it was built with the same tools OpenAI sells to developers
  (Codex, GPT-5, the Evals API, and the Embeddings API).
headline_metric: Employees go from question to insight in minutes rather than days, on a data
  platform of more than 3.5k internal users, 600+ PB, and 70k datasets
architecture:
  harness: Bespoke in-house agent built on OpenAI's own stack (Codex, GPT-5, Evals API, Embeddings API)
  model: GPT-5; Codex powers table-level knowledge and the codebase crawl
  tool_access: Live SQL against the data warehouse, plus the metadata service, Airflow, and
    Spark; web search; can publish notebooks and reports
  knowledge: 'Six context layers: schema metadata and lineage, historical queries, curated
    expert descriptions, code-derived table definitions from Codex, embedded Slack, Google
    Docs, and Notion behind a permissions-aware retrieval service, and live runtime warehouse
    inspection.'
  credentials: Strictly pass-through. The agent inherits the user's existing table permissions,
    flags missing access, and falls back to authorized datasets.
  context_mgmt: A daily offline pipeline aggregates table usage, human annotations, and
    Codex-derived enrichment into embeddings for retrieval-augmented generation. Global and
    personal memories persist corrections across sessions.
  interfaces: []
primitives:
- name: Layered data context
  desc: Six grounding layers (metadata, query history, expert curation, code-derived
    definitions, embedded internal documents, live warehouse inspection) tell similar tables apart.
- name: Self-learning memory
  desc: Corrections and data nuances are saved at global and personal scope and reused, so
    later answers start from a more accurate baseline.
- name: Golden-SQL evals
  desc: Curated question-and-answer pairs with hand-written reference SQL run continuously.
    Generated SQL and its results are compared against the expected output and scored by
    OpenAI's Evals grader as regression canaries.
- name: Workflows
  desc: Recurring analyses are packaged into reusable instruction sets, such as weekly
    business reports and table validations.
- name: Pass-through permission layer
  desc: The agent operates purely as an interface layer over OpenAI's existing security and
    access-control model, so users can only query tables they already may access.
key_metrics:
- The data platform serves more than 3.5k internal users across Engineering, Product, and Research
- The platform spans more than 600 PB of data across 70k datasets
- Teams across Engineering, Data Science, Go-To-Market, Finance, and Research use the agent for
  high-impact data questions
lessons_learned:
- Exposing the full tool set confused the agent because overlapping tools created ambiguity.
  OpenAI restricted and consolidated tool calls.
- Highly prescriptive prompting degraded results. Higher-level guidance that let GPT-5 choose
  the execution path worked better.
- A table's real meaning lives in the code that produces it. Crawling the codebase with Codex
  beat warehouse metadata and query history alone.
