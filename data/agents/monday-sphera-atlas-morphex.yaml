claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source states that nineteen of every twenty Morphex PRs merge automatically by passing
      every gate and that approved PRs ship to production with no human in the loop; a PR below the confidence
      threshold routes to a human.
    valid_at: '2026'
  operating_models.1:
    confidence: unverified
    confidence_reason: The evidence is two-sided for Atlas; the source describes tests running before a request
      for human review while also describing confidence-threshold auto-merge as being driven out over the following
      two quarters.
    valid_at: '2026'
  lessons_learned.introduced-evaluations-too-late-growing-pr:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The authors describe replacing a looks-fine standard with deterministic metrics and model-scored
      evaluations, and explicitly regret waiting until month nine.
  lessons_learned.replaced-unsuccessful-transcript-retrieval-experiments:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The memory section describes failed context stuffing and vector retrieval for Atlas, then
      names the file lifecycle. It does not compare retrieval methods on other workloads.
  lessons_learned.added-remote-sandbox-checks-production-traffic:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The sandbox section states the observed failure and the checks run before Atlas requests
      human review.
  lessons_learned.uses-same-repository-ci-guardrails-checks:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Morphex section names the shared controls and says automatic merges depend on passing
      the gates.
  lessons_learned.uses-blocking-automated-reviewers-engineering-standards:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The article describes the evaluation feedback and Guardrails reviewers separately; these
      mechanisms do not guarantee that every accepted change is safe.
  headline_metric:
    metric_scope: Morphex PRs that merge automatically after CI and Guardrails pass
    denominator: Morphex pull requests; sample size and period not supplied
    category: adoption-output
    basis: reported-measurement
    subject: 'Morphex pull requests merging
      automatically after passing every gate, with approved PRs shipping to production without a human'
  key_metrics.prs-merge-automatically-without-human-review:
    metric_scope: Morphex PRs that merge automatically after CI and Guardrails pass
    denominator: Morphex pull requests; sample size and period not supplied
  key_metrics.builders-use-ai-coding-tools-monthly:
    metric_scope: Monthly AI coding-tool adoption among monday Builders, including engineers, PMs, analysts, and
      designers
    denominator: Builders; not exclusively engineers
    category: adoption-output
    basis: reported-measurement
    subject: 'Monthly AI coding-tool use
      among monday Builders, including engineers, PMs, analysts, and designers'
  key_metrics.engineer-pr-throughput-increased:
    metric_scope: Per-engineer pull-request throughput
    denominator: Engineers; baseline period and cohort size not specified
    category: adoption-output
    basis: reported-measurement
    subject: 'Per-engineer pull-request
      throughput'
  key_metrics.guardrails-catches-agent-prs-human-review:
    metric_scope: Recent cut of top PR-generating agents; Guardrails rejection before review and reverts among merged
      PRs
    denominator: Agent PRs for Guardrails rejection; merged PRs for revert rate
    category: effectiveness
    basis: reported-measurement
    subject: 'Guardrails pre-review rejection
      of agent PRs and the revert rate among merged agent PRs'
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [monday-sphera-atlas-morphex-source-1]
  workflow_scope: 'Sphera agent feature task from an inbox trigger to production ship; Morphex merges autonomously
    above the confidence threshold while Atlas requests human review after the sandbox gate'
  questions:
    purpose: {state: reported}
    workflow: {state: reported, claim_paths: [primitives.receive-task-one-three-inboxes, primitives.implement-the-feature-task, primitives.auto-deploy-pr-remote-sandbox, primitives.merge-above-the-confidence-threshold], note: 'The
      four run steps describe the shared Sphera pipeline; the final gate differs by agent as the scope states.'}
    human_involvement: {state: reported, claim_paths: [operating_models.0, operating_models.1], note: 'Morphex runs
      exception-only: a below-threshold PR routes to a human and an approved PR ships with none. Atlas runs sandbox
      checks before asking for human review; the source calls threshold auto-merge a following-two-quarters goal
      for that population.'}
    implementation: {state: reported}
    validation: {state: reported, claim_paths: [primitives.pr-guardrails, primitives.auto-deploy-pr-remote-sandbox, lessons_learned.uses-blocking-automated-reviewers-engineering-standards], note: 'Validation is
      the blocking Guardrails reviewers, the remote-sandbox tests with replayed production traffic, and the
      deterministic and LLM-scored evals fed back into the harness.'}
    observations: {state: reported}
    lessons: {state: reported}
  aliases:
