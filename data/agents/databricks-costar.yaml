# yaml-language-server: $schema=../agent.schema.json
id: databricks-costar
company: Databricks
agent_name: coSTAR
approach_type: supporting-pattern
deployment_stage: scaled
first_public_evidence:
  date: '2025'
  source_id: databricks-costar-source-1
last_reviewed_at: '2026-10-08'
status: internal
domains:
- coding
- code-review
- on-call
autonomy: unknown
operating_models:
- scope: internal engineering workflows → agent-produced changes
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  - background
  evidence_strength: detailed-primary
summary: Databricks ships and tests engineering agents with coSTAR, using LLM judges as the
  test suite and a coding assistant to refine an agent until the judges pass. The agents cover
  internal engineering workflows such as on-call support and automated code review, alongside
  customer-facing and open-source agents such as the MLflow assistant. Databricks' Omnigent
  is a separate product.
architecture:
  harness: coSTAR framework for shipping and testing internal agents
  knowledge: Private benchmark built from the Databricks multi-million line codebase
  tool_access: Internal agents call MCP tools for data access, code execution, and environment setup
primitives:
- id: run-scenario-against-agent-under-test
  name: Run the scenario against the agent under test
  desc: The coSTAR test harness sends each scenario prompt to the agent under test and captures the execution as
    an MLflow trace
  role: workflow
- id: score-the-trace-with-aligned-judges
  name: Score the trace with aligned judges
  desc: Agentic judges inspect the trace for properties such as code validity, best-practice adherence, and tool
    sequencing instead of asserting exact outputs
  role: workflow
- id: refine-agent-until-judges-pass
  name: Refine the agent until the judges pass
  desc: A coding assistant reads judge failures, diagnoses root causes, and patches the agent while the engineer
    remains the reviewer and final arbiter of the proposed changes
  role: workflow
- id: align-judges-against-human-graded-golden
  name: Align judges against a human-graded Golden Set
  desc: Judge alignment refines the judges against a Golden Set of engineer-assessed outputs using MLflow alignment
    techniques
  role: mechanism
- id: run-judges-production-ci
  name: Run the judges in production and CI
  desc: The same judges run on production traffic, in CI/CD pipelines, and on nightly builds to catch regressions
    from agent or infrastructure changes
  role: validation
key_metrics:
- id: agent-change-verification-time
  text: coSTAR reduced the time to verify agent changes from two weeks down to hours
- id: private-benchmark-built-multi-million-line
  text: Private benchmark built from a multi-million line codebase
lessons_learned:
- id: give-judges-tools-traces-databricks-reports
  text: 'Give judges tools, not traces: Databricks reports that agentic judges which call targeted tools on a trace scale
    better than feeding the full trace into a model'
