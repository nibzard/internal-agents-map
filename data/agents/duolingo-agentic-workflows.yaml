claim_metadata:
  operating_models.0:
    confidence: medium
    confidence_reason: The post says Duos test the prompt until they judge it successful and stage the workflow
      for end-to-end testing before merging the form. It does not say who else reviews a form, so the boundary covers
      the creator only.
    valid_at: "2025-12"
  operating_models.1:
    confidence: unverified
    confidence_reason: The post describes the run pattern as commit and optionally open a pull request, but never
      says whether a person must review the change before it takes effect.
    valid_at: "2025-12"
  key_metrics.duo-create-workflow-follows-common-pattern:
    confidence: low
    confidence_reason: The five-minute figure appears as a section heading and in the TL;DR of a Duolingo blog post.
      No sample, period, or timing method is reported, so it states an expected creation time rather than a measured
      result.
    valid_at: "2025-12"
    reported_by: Duolingo
    metric_scope: Time for a Duo to create a workflow that follows the common clone-change-commit pattern through
      the JSON form
    category: cost-latency
    basis: estimate
    subject: "Time for a Duo to create a JSON-form workflow that follows the common pattern, stated as under five
      minutes"
  key_metrics.average-days-create-custom-temporal-workflow:
    confidence: low
    confidence_reason: Duolingo reports this as an average in its own blog post, but gives a one-day range with
      no sample size, period, or collection method, so it reads as a rough in-house figure.
    valid_at: "2025-12"
    reported_by: Duolingo
    metric_scope: Time to create a custom Temporal workflow by running BootstrapTemporalWorkflow and copying an
      existing workflow
    category: cost-latency
    basis: estimate
    subject: "Average time to create a custom Temporal workflow, stated as 1-2 days"
  lessons_learned.found-one-pattern-recurring-coding-agents:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post names the three-step pattern and states that the no-code form was built for common
      patterns like this. It describes Duolingo's own repositories and does not claim the pattern fits other organizations.
  lessons_learned.splits-multi-step-agent-workflow-single:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The multi-step section states the one-activity-per-step rule and gives the reason, that AI
      non-determinism should not restart the whole process. No failure rate or comparison is reported.
  lessons_learned.routes-pull-requests-all-agents-through:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The GitHub library section states the shared App token, the bot account, and the central
      permissions. The post does not describe what those permissions allow or deny.
  lessons_learned.running-docker-inside-temporal-blocks-set:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The next-steps section names Docker in Docker on Temporal as the blocker for a large set
      of features and says it is being addressed. The expected fix date is Duolingo's forecast, so it is left out
      of the lesson.
  lessons_learned.authors-describe-agentic-workflows-duolingo-early:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The closing section is the authors' own assessment of their work; it is a stated position
      about Duolingo's maturity, not a measured finding.
page_content:
  version: 1
  reviewed_at: "2026-09-21"
  source_ids:
  - duolingo-agentic-workflows-source-1
  workflow_scope: "JSON workflow form → published internal tool whose run clones the repository, makes the code change,
    and commits it, optionally opening a pull request"
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.fill-out-the-workflow-form
      - primitives.publish-to-the-internal-tool-list
      - primitives.run-the-common-pattern
      note: "The three primitives cover the documented JSON-form path. The CodingAgent library, the GitHub package,
        and the Temporal multi-step pattern are mechanisms that support a run, not steps of it."
    human_involvement:
      state: reported
      claim_paths:
      - operating_models.0
      note: "The post locates human attention in workflow creation only: the creator tests the prompt and stages
        end-to-end testing before merging the form. It does not document who reviews the output of a run, which
        the second operating-model claim records as unknown in research details."
    implementation:
      state: reported
    validation:
      state: reported
      claim_paths:
      - primitives.test-the-prompt
      note: "Validation is documented at creation time, as prompt iteration plus staged end-to-end testing. No per-run
        check of a workflow's output is described."
    observations:
      state: reported
      note: "Both figures are creation-time claims about the platform. The post reports no outcome of any workflow
        built on it, so no downstream agent result is attributed here."
    lessons:
      state: reported
  implementation_fields:
    model:
      state: unreported
      note: "The post names the Codex CLI and the Claude Code SDK as the agents it wraps, but identifies no model
        for any workflow. Next research action: look for a Duolingo post or talk that names the models behind the
        CodingAgent library."
    sandbox:
      state: unreported
      note: 'No execution isolation is described; the Docker-in-Docker blocker names a constraint, not the
        environment a workflow runs in.'
    tool_access:
      note: "The GitHub utility package is in production. The GitHub MCP server is described as a prototype and
        the Atlassian server as planned; neither is a shipped capability."
    knowledge:
      state: unreported
      note: "The form carries a prompt and one repository; no knowledge base, retrieval, or company-context source
        is described. Next research action: check whether the expanded agent.json or a later post documents context
        sources."
    context_mgmt:
      state: unreported
      note: "Durable retries across Temporal activities are described, but nothing about how agent context is carried
        between passes or runs."
    credentials:
      note: "The post names the shared GitHub App token and the bot account, but not what the central permissions
        allow."
