# yaml-language-server: $schema=../agent.schema.json
id: microsoft-prassistant
company: Microsoft
agent_name: AI-powered code review assistant
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: 2025-07
  source_id: microsoft-prassistant-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: pull request → AI review comments
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  evidence_strength: detailed-primary
summary: Microsoft's internal AI-powered code review assistant, built in close collaboration with its Developer
  Division's Data & AI team. It joins each pull request as a reviewer, summarizes the change, and comments on
  specific lines with suggested edits the author applies. Microsoft says it shaped GitHub's Copilot code review.
headline_metric: Supports more than 90% of Microsoft PRs, impacting over 600,000 pull requests per month
architecture:
  knowledge: Repository-specific guidelines and custom review prompts can guide specialized reviews
primitives:
- {id: automatic-first-review, name: Automatic first review, desc: Creating a pull request can automatically start the assistant as a reviewer, role: workflow}
- {id: review-and-summarize, name: Review and summarize, desc: "The assistant reviews the diff, writes a pull-request summary, and posts categorized findings on specific lines", role: workflow}
- {id: suggest-changes, name: Suggest changes, desc: "For a bug or suboptimal pattern, the assistant proposes a code snippet or alternative implementation", role: workflow}
- {id: author-decision, name: Author decision, desc: "The author reviews, edits, and explicitly applies a suggestion; the assistant does not commit it directly", role: workflow}
- {id: pull-request-q-and-a, name: Pull-request Q&A, desc: Reviewers can ask the assistant questions in the pull-request discussion and receive answers about the code, role: workflow}
key_metrics:
- id: pull-request-coverage
  text: More than 90% of pull requests across the company
- id: pull-requests-impacted-per-month
  text: More than 600,000 pull requests impacted per month
- id: repositories-early-onboarding
  text: About 5,000 repositories in early onboarding
- id: median-pull-request-completion-time-improvement
  text: 10–20% median pull-request completion-time improvement in an early 5,000-repository cohort
