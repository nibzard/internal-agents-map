# yaml-language-server: $schema=../agent.schema.json
# Copy this file to data/agents/<id>.yaml.
# Read data/schema.md before you edit the record.
# The first line gives the path of data/agent.schema.json from data/agents/.
# A YAML editor then shows the allowed values and the errors while you type.

id: company-agent
company: Company
agent_name: Agent
# aliases: [Former name]
# relationships:
#   - type: component-of
#     approach_id: company-platform
# Structural type: agent, agent-system, platform, orchestration-system, or supporting-pattern.
# This does not describe how the work starts.
approach_type: agent
deployment_stage: prototype
# The build derives year from first_public_evidence.date.
first_public_evidence:
  date: "2026-08"
  source_id: company-agent-source-1
last_reviewed_at: "2026-08-12"
status: internal
domains: [coding]
autonomy: unknown
operating_models:
  # Scope and human-attention boundary travel together. Do not infer authority or runtime length.
  - scope: "task input → reviewed output"
    attention_boundary: unknown
rubric:
  # Invocation is independent of approach_type; list each supported mode or use unknown.
  invocation: [unknown]
  evidence_strength: limited-primary
summary: "A factual description of the reported approach."
headline_metric: "A self-reported metric with its date and scope."

# Add only the fields a source documents: sandbox, harness, model, interfaces,
# tool_access, knowledge, credentials, and context_mgmt. Never write unknown or an empty value.
architecture: {}

# Each item has a kebab-case id with at least one letter, unique in its list.
# Claim paths name the item by its id, such as primitives.open-a-run.
# A primitive has a role: workflow, mechanism, or validation.
primitives: []
#   - {id: open-a-run, name: Open a run, desc: "What the step does", role: workflow}
key_metrics: []
#   - {id: weekly-runs, text: "A reported metric with its date and scope"}
lessons_learned: []
#   - {id: gate-before-review, text: "A scoped lesson"}

sources:
  - id: company-agent-source-1
    title: "Source title"
    url: "https://example.com/source"
    kind: engineering-blog
    provenance_class: first-party
    published_at: "2026-08"
    accessed_at: "2026-08-12"
    last_verified_at: "2026-08-12"
    # capture:
    #   manifest_path: "archive/sources/company-agent-source-1/metadata.json"

# A link names its source_id only when the record has more than one source.
# The relation is supports unless you write contradicts or contextualizes.
evidence:
  operating_models.0:
    - locator: "Human review boundary"
  summary:
    - locator: "Section heading"
  headline_metric:
    - locator: "Metrics, paragraph 2"

claim_metadata:
  operating_models.0:
    confidence: unverified
    confidence_reason: "The public evidence does not document where human attention returns."
    valid_at: "2026-08"
  headline_metric:
    confidence: medium
    confidence_reason: "The organization reported this metric without an independent review."
    valid_at: "2026-08"
    # Every metric has a category, a basis, and a subject, or an entry in page_content.aliases.
    category: adoption-output
    basis: qualitative
    subject: "The thing that the metric counts"
    reported_by: Company
    metric_scope: "The work measured by this metric"
    denominator: "The relevant total, when available"
    measurement_method: "The reported collection method, when available"

# Optional review contract. Write it only after you read every source listed in source_ids.
# Record the state of all seven questions. Write claim_paths only for workflow,
# human_involvement, and validation; the build derives the other four and every
# implementation field. Do not turn a missing value into "unreported" until the source
# review is complete.
# page_content:
#   version: 1
#   reviewed_at: "2026-08-12"
#   source_ids: [company-agent-source-1]
#   workflow_scope: "task input → reviewed output"
#   questions:
#     purpose: {state: reported}
#     workflow: {state: reported, claim_paths: [primitives.open-a-run]}
#     human_involvement: {state: unreported}
#     implementation: {state: unreported}
#     validation: {state: unreported}
#     observations: {state: reported}
#     lessons: {state: unreported}
#   implementation_fields:
#     sandbox: {state: not-applicable, note: "The agent runs no code."}
#   aliases:
#     key_metrics.weekly-runs: {duplicate_of: headline_metric, reason: "Same count and period."}
